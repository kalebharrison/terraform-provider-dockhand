name: Bug report
description: Report a provider bug or regression
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include enough detail to reproduce.
  - type: input
    id: version
    attributes:
      label: Provider version
      description: "Example: v0.1.48"
      placeholder: v0.1.48
    validations:
      required: true
  - type: textarea
    id: terraform_config
    attributes:
      label: Terraform configuration
      description: Minimal config that reproduces the issue
      render: hcl
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Error output
      description: Full Terraform error/diagnostics
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: OS, Terraform/OpenTofu version, Dockhand version
      placeholder: |
        OS:
        Terraform/OpenTofu:
        Dockhand:
    validations:
      required: true
