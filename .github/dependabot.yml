version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "first-monday"
      time: "05:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    groups:
      gomod-monthly:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "first-monday"
      time: "05:15"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    groups:
      actions-monthly:
        patterns:
          - "*"
    labels:
      - "dependencies"
