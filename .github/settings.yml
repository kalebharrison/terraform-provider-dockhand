repository:
  allow_auto_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_squash_merge: true
  default_branch: main
  delete_branch_on_merge: true
  has_issues: true
  has_projects: false
  has_wiki: false

vulnerability_alerts: true
automated_security_fixes: true

branches:
  - name: main
    protection:
      allow_deletions: false
      allow_force_pushes: false
      required_status_checks:
        strict: true
        contexts:
          - Lint, Test, Build
          - Dockhand + DinD Acceptance Tests
          - Require linked issue and mark in-progress
          - Conventional PR title
          - Secret Scan
          - actionlint
          - Analyze (Go) (go)
          - Go Vulnerability Check
          - dependency-review
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        required_approving_review_count: 0
      enforce_admins: true
      required_conversation_resolution: true
      required_linear_history: true
      restrictions: null

labels:
  - name: bug
    color: d73a4a
    description: Something is broken or regressed
  - name: enhancement
    color: a2eeef
    description: New capability or behavior request
  - name: documentation
    color: 0075ca
    description: Documentation-only work
  - name: dependencies
    color: 0366d6
    description: Dependency or pinned-version updates
  - name: security
    color: b60205
    description: Security hardening or vulnerability work
  - name: ci
    color: 5319e7
    description: CI, release, or automation work
  - name: maintenance
    color: c5def5
    description: Refactors, cleanup, or repo hygiene
  - name: agent
    color: "0E8A16"
    description: Automated agent-authored work
  - name: agent-auto-merge
    color: "1D76DB"
    description: Opt-in squash auto-merge for agent PRs when checks pass
  - name: compat-reports-sync
    color: "5319E7"
    description: Automated compatibility report refresh PR (acceptance skipped)
  - name: in-progress
    color: "1D76DB"
    description: Issue is linked to an open pull request
  - name: awaiting-release
    color: "FBCA04"
    description: Issue fixed on main and waiting for a tagged release
  - name: released
    color: "0E8A16"
    description: Issue is included in a published release
  - name: regression
    color: "B60205"
    description: Reporter indicates fix did not work; needs follow-up
  - name: agent-dispatched
    color: "5319E7"
    description: Cursor Cloud Agent dispatched for this issue
  - name: question
    color: d876e3
    description: Usage or clarification requests
  - name: "status: blocked"
    color: "000000"
    description: Waiting on an external dependency or decision
  - name: "status: needs-info"
    color: fbca04
    description: More detail is needed before work can continue
  - name: "status: in-progress"
    color: 1d76db
    description: Issue is linked to an open pull request
  - name: awaiting-release
    color: fbcA04
    description: Issue fixed on main and waiting for a tagged release
