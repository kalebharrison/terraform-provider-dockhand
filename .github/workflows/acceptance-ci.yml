name: Acceptance CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Dockhand + DinD Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCKHAND_IMAGE: fnsys/dockhand:latest
      DIND_IMAGE: docker:27-dind
      HAWSER_IMAGE: ghcr.io/finsys/hawser:latest
      DOCKHAND_TEST_ENDPOINT: http://127.0.0.1:13001
      DOCKHAND_TEST_USERNAME: tfacc
      DOCKHAND_TEST_PASSWORD: tfaccpass123!
      DOCKHAND_TEST_AUTH_PROVIDER: local
      DOCKHAND_TEST_DIND_HOST: dind
      DOCKHAND_TEST_DIND_PORT: "2375"
      DOCKHAND_TEST_ENABLE_PRUNE_ACTIONS: "true"
      DOCKHAND_TEST_PRUNE_MODE: containers

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Ensure Terraform CLI
        shell: bash
        run: |
          set -euo pipefail

          if command -v terraform >/dev/null 2>&1; then
            terraform_path="$(command -v terraform)"
            echo "TF_ACC_TERRAFORM_PATH=${terraform_path}" >> "${GITHUB_ENV}"
            "${terraform_path}" version
            exit 0
          fi

          version="1.14.8"
          arch="$(uname -m)"
          case "${arch}" in
            x86_64) arch="amd64" ;;
            arm64|aarch64) arch="arm64" ;;
            *)
              echo "unsupported architecture for Terraform download: ${arch}" >&2
              exit 1
              ;;
          esac

          install_dir="${RUNNER_TEMP}/terraform-${version}"
          mkdir -p "${install_dir}"

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_${arch}.zip" \
            -o "${RUNNER_TEMP}/terraform.zip"
          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_SHA256SUMS" \
            -o "${RUNNER_TEMP}/terraform_SHA256SUMS"

          (
            cd "${RUNNER_TEMP}"
            grep "terraform_${version}_linux_${arch}.zip" terraform_SHA256SUMS | sha256sum --check --status
          )
          unzip -q "${RUNNER_TEMP}/terraform.zip" -d "${install_dir}"

          terraform_path="${install_dir}/terraform"
          echo "TF_ACC_TERRAFORM_PATH=${terraform_path}" >> "${GITHUB_ENV}"
          "${terraform_path}" version

      - name: Validate acceptance manifest parity
        shell: bash
        run: |
          set -euo pipefail
          GOCACHE="$PWD/.cache/go-build" \
          GOMODCACHE="$PWD/.cache/gomod" \
          go test ./internal/provider -run TestAcceptanceManifestCoverage

      - name: Run targeted acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          TEST_REGEX='TestAcc(UserResourceTerraform|ContainerRenameActionTerraform|ContainerUpdateActionTerraform|EnvironmentResourceDirectDinDTerraform|EnvironmentResourceAgentTokenTerraform|ScannerAndImageScanActionsTerraform|ImagePushActionTerraform|StackAdoptActionTerraform|GitHelperSurfacesTerraform)' \
          RUN_ENDPOINT_PROBE=false \
          ./scripts/run-acceptance-harness.sh
