name: Acceptance CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Dockhand + DinD Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCKHAND_IMAGE: fnsys/dockhand:latest
      DIND_IMAGE: docker:27-dind
      HAWSER_IMAGE: ghcr.io/finsys/hawser:latest
      DOCKHAND_TEST_ENDPOINT: http://127.0.0.1:13001
      DOCKHAND_TEST_USERNAME: tfacc
      DOCKHAND_TEST_PASSWORD: tfaccpass123!
      DOCKHAND_TEST_AUTH_PROVIDER: local
      DOCKHAND_TEST_DIND_HOST: dind
      DOCKHAND_TEST_DIND_PORT: "2375"
      DOCKHAND_TEST_ENABLE_PRUNE_ACTIONS: "true"
      DOCKHAND_TEST_PRUNE_MODE: containers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Start Docker-in-Docker
        shell: bash
        run: |
          set -euo pipefail
          docker network create dockhand-ci
          docker run -d --name dind --network dockhand-ci --privileged \
            -e DOCKER_TLS_CERTDIR= \
            -p 23750:2375 \
            "${DIND_IMAGE}" \
            --tls=false \
            --host=tcp://0.0.0.0:2375 \
            --host=unix:///var/run/docker.sock

      - name: Wait for DinD daemon
        shell: bash
        run: |
          set -euo pipefail
          attempt=0
          while (( attempt < 90 )); do
            if docker --host tcp://127.0.0.1:23750 version >/tmp/dind-version.out 2>/tmp/dind-version.err; then
              echo "DinD Docker API is reachable."
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 2
          done

          echo "DinD Docker API did not become reachable in time." >&2
          cat /tmp/dind-version.err || true
          docker logs dind || true
          exit 1

      - name: Start Dockhand
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dockhand --network dockhand-ci \
            -p 13001:3000 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "${DOCKHAND_IMAGE}"

      - name: Wait for Dockhand API
        shell: bash
        run: |
          set -euo pipefail
          attempt=0
          while (( attempt < 60 )); do
            code="$(curl -sS -o /dev/null -w "%{http_code}" "${DOCKHAND_TEST_ENDPOINT}/api/auth/session" || true)"
            if [[ "$code" != "000" && "$code" != "502" && "$code" != "503" ]]; then
              echo "Dockhand API is reachable (status ${code})."
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          echo "Dockhand API did not become reachable in time." >&2
          exit 1

      - name: Bootstrap auth and first admin
        shell: bash
        run: |
          set -euo pipefail

          login() {
            local code
            code="$(curl -sS -o /tmp/dh-login.json -w "%{http_code}" \
              -c /tmp/dh-cookies.txt \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${DOCKHAND_TEST_USERNAME}\",\"password\":\"${DOCKHAND_TEST_PASSWORD}\",\"authProvider\":\"${DOCKHAND_TEST_AUTH_PROVIDER}\"}" \
              "${DOCKHAND_TEST_ENDPOINT}/api/auth/login" || true)"
            [[ "${code}" =~ ^2[0-9][0-9]$ ]]
          }

          if login; then
            echo "Login succeeded without bootstrap."
            exit 0
          fi

          echo "Bootstrapping first admin user."
          user_payload="$(jq -nc \
            --arg u "${DOCKHAND_TEST_USERNAME}" \
            --arg p "${DOCKHAND_TEST_PASSWORD}" \
            '{username:$u,password:$p,email:"tfacc@example.local",displayName:"TF Acc CI",isAdmin:true,isActive:true}')"
          curl -sS -o /tmp/dh-bootstrap-user.json -w "%{http_code}\n" \
            -H "Content-Type: application/json" \
            -d "${user_payload}" \
            "${DOCKHAND_TEST_ENDPOINT}/api/users" | tee /tmp/dh-bootstrap-user.code

          echo "Ensuring auth is enabled."
          auth_payload='{"authEnabled":true,"defaultProvider":"local","sessionTimeout":86400}'
          curl -sS -o /tmp/dh-bootstrap-auth.json -w "%{http_code}\n" \
            -X PUT \
            -H "Content-Type: application/json" \
            -d "${auth_payload}" \
            "${DOCKHAND_TEST_ENDPOINT}/api/auth/settings" | tee /tmp/dh-bootstrap-auth.code || true

          for _ in $(seq 1 20); do
            if login; then
              echo "Login succeeded after bootstrap."
              exit 0
            fi
            sleep 2
          done

          echo "Bootstrap failed; could not log in with test user." >&2
          echo "User bootstrap response:"
          cat /tmp/dh-bootstrap-user.json || true
          echo "Auth bootstrap response:"
          cat /tmp/dh-bootstrap-auth.json || true
          echo "Login response:"
          cat /tmp/dh-login.json || true
          exit 1

      - name: Create DinD environment and export default env
        shell: bash
        run: |
          set -euo pipefail

          curl -sS -o /tmp/dh-login.json -w "%{http_code}" \
            -c /tmp/dh-cookies.txt \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKHAND_TEST_USERNAME}\",\"password\":\"${DOCKHAND_TEST_PASSWORD}\",\"authProvider\":\"${DOCKHAND_TEST_AUTH_PROVIDER}\"}" \
            "${DOCKHAND_TEST_ENDPOINT}/api/auth/login" >/tmp/dh-login.code

          existing_id="$(curl -sS -b /tmp/dh-cookies.txt "${DOCKHAND_TEST_ENDPOINT}/api/environments" | jq -r '.[] | select(.name=="ci-dind") | .id' | head -n 1)"
          if [[ -z "${existing_id}" ]]; then
            payload="$(jq -nc \
              --arg host "${DOCKHAND_TEST_DIND_HOST}" \
              --argjson port "${DOCKHAND_TEST_DIND_PORT}" \
              '{name:"ci-dind",connectionType:"direct",host:$host,port:$port,protocol:"http",tlsSkipVerify:false,collectActivity:true,collectMetrics:true,highlightChanges:true,icon:"globe"}')"
            curl -sS -b /tmp/dh-cookies.txt \
              -H "Content-Type: application/json" \
              -d "${payload}" \
              "${DOCKHAND_TEST_ENDPOINT}/api/environments" >/tmp/dh-created-env.json
            existing_id="$(jq -r '.id // empty' /tmp/dh-created-env.json)"
          fi

          if [[ -z "${existing_id}" ]]; then
            echo "Failed to resolve ci-dind environment id." >&2
            curl -sS -b /tmp/dh-cookies.txt "${DOCKHAND_TEST_ENDPOINT}/api/environments" || true
            exit 1
          fi

          echo "DOCKHAND_TEST_DEFAULT_ENV=${existing_id}" >> "${GITHUB_ENV}"
          echo "Using DOCKHAND_TEST_DEFAULT_ENV=${existing_id}"

      - name: Prepare Hawser edge agent settings
        shell: bash
        run: |
          set -euo pipefail
          agent_token="ci-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          hawser_container="hawser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dockhand_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' dockhand)"
          if [[ -z "${dockhand_ip}" ]]; then
            echo "Could not resolve Dockhand container IP." >&2
            docker inspect dockhand || true
            exit 1
          fi
          dockhand_ws_url="ws://${dockhand_ip}:3000/api/hawser/connect"

          {
            echo "DOCKHAND_TEST_AGENT_TOKEN=${agent_token}"
            echo "DOCKHAND_TEST_AGENT_NAME=ci-hawser"
            echo "DOCKHAND_TEST_HAWSER_SERVER_URL=${dockhand_ws_url}"
            echo "DOCKHAND_TEST_HAWSER_CONTAINER=${hawser_container}"
            echo "DOCKHAND_TEST_HAWSER_DOCKER_HOST=tcp://127.0.0.1:23750"
            echo "DOCKHAND_TEST_HAWSER_IMAGE=${HAWSER_IMAGE}"
          } >> "${GITHUB_ENV}"

      - name: Validate acceptance manifest parity
        shell: bash
        run: |
          set -euo pipefail
          GOCACHE="$PWD/.cache/go-build" \
          GOMODCACHE="$PWD/.cache/gomod" \
          go test ./internal/provider -run TestAcceptanceManifestCoverage

      - name: Run targeted acceptance tests
        env:
          TF_ACC: "1"
        shell: bash
        run: |
          set -euo pipefail
          GOCACHE="$PWD/.cache/go-build" \
          GOMODCACHE="$PWD/.cache/gomod" \
          go test -v ./internal/provider -run 'TestAcc(UserResourceTerraform|ContainerRenameActionTerraform|ContainerUpdateActionTerraform|EnvironmentResourceDirectDinDTerraform|EnvironmentResourceAgentTokenTerraform)'

      - name: Dockhand logs (failure)
        if: failure()
        shell: bash
        run: |
          docker logs dockhand || true
          docker logs dind || true
          if [[ -n "${DOCKHAND_TEST_HAWSER_CONTAINER:-}" ]]; then
            docker --host tcp://127.0.0.1:23750 logs "${DOCKHAND_TEST_HAWSER_CONTAINER}" || true
          fi

      - name: Cleanup containers
        if: always()
        shell: bash
        run: |
          docker --host tcp://127.0.0.1:23750 rm -f hawser >/dev/null 2>&1 || true
          docker rm -f dockhand dind >/dev/null 2>&1 || true
          docker network rm dockhand-ci >/dev/null 2>&1 || true
