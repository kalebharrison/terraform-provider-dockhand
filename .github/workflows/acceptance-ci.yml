name: Acceptance CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Evaluate acceptance scope
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.eval.outputs.skip }}
    steps:
      - name: Detect compat reports refresh PR
        id: eval
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          skip=false
          if [[ "${EVENT_NAME}" == "pull_request" ]] && [[ "${HEAD_REF}" == automation/compat-reports-sync* ]]; then
            skip=true
          fi
          echo "skip=${skip}" >> "${GITHUB_OUTPUT}"

  acceptance:
    name: Dockhand + DinD Acceptance Tests
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCKHAND_IMAGE: fnsys/dockhand:latest
      DIND_IMAGE: docker:27-dind
      HAWSER_IMAGE: ghcr.io/finsys/hawser:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform

      - name: Validate acceptance manifest parity
        shell: bash
        run: |
          set -euo pipefail
          GOCACHE="$PWD/.cache/go-build" \
          GOMODCACHE="$PWD/.cache/gomod" \
          go test ./internal/provider -run TestAcceptanceManifestCoverage

      - name: Resolve PR acceptance regex
        id: pr_regex
        shell: bash
        run: |
          set -euo pipefail
          regex="$(/usr/bin/python3 scripts/acceptance-pr-ci-regex.py)"
          echo "regex=${regex}" >> "${GITHUB_OUTPUT}"
          echo "Using PR acceptance regex: ${regex}"

      - name: Run targeted acceptance harness
        id: harness
        shell: bash
        env:
          DOCKHAND_TEST_ENDPOINT: http://127.0.0.1:13001
          DOCKHAND_TEST_USERNAME: tfacc
          DOCKHAND_TEST_PASSWORD: tfaccpass123!
          DOCKHAND_TEST_AUTH_PROVIDER: local
          DOCKHAND_TEST_DIND_HOST: dind
          DOCKHAND_TEST_DIND_PORT: "2375"
          DOCKHAND_TEST_ENABLE_PRUNE_ACTIONS: "true"
          DOCKHAND_TEST_PRUNE_MODE: containers
          TF_ACC: "1"
        run: |
          set -euo pipefail
          TEST_REGEX="${{ steps.pr_regex.outputs.regex }}" \
          RUN_ENDPOINT_PROBE=false \
          ./scripts/run-acceptance-harness.sh

      - name: Scrub acceptance failure logs
        if: failure() && steps.harness.outcome == 'failure'
        run: python3 scripts/scrub-artifact-json.py

      - name: Upload acceptance failure logs
        if: failure() && steps.harness.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-ci-logs-${{ github.run_id }}
          path: |
            /tmp/dh-*.json
            /tmp/dh-*.code
          if-no-files-found: ignore

  acceptance-skip:
    name: Dockhand + DinD Acceptance Tests
    needs: gate
    if: needs.gate.outputs.skip == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip upstream-validated compat reports refresh
        run: |
          echo "Compat reports PR; acceptance already passed in Dockhand Compat."
