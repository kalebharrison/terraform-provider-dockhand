name: Acceptance Full

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      dockhand_image:
        description: "Dockhand image (for example: fnsys/dockhand:latest)"
        required: false
        default: "fnsys/dockhand:latest"
      test_regex:
        description: "Go test regex for acceptance run"
        required: false
        default: "TestAcc"

permissions:
  contents: read

concurrency:
  group: acceptance-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full Recursive Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DOCKHAND_IMAGE: ${{ inputs.dockhand_image || 'fnsys/dockhand:latest' }}
      TEST_REGEX: ${{ inputs.test_regex || 'TestAcc' }}
      RUN_ENDPOINT_PROBE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Ensure Terraform CLI
        shell: bash
        run: |
          set -euo pipefail

          if command -v terraform >/dev/null 2>&1; then
            terraform_path="$(command -v terraform)"
            echo "TF_ACC_TERRAFORM_PATH=${terraform_path}" >> "${GITHUB_ENV}"
            "${terraform_path}" version
            exit 0
          fi

          version="1.14.8"
          arch="$(uname -m)"
          case "${arch}" in
            x86_64) arch="amd64" ;;
            arm64|aarch64) arch="arm64" ;;
            *)
              echo "unsupported architecture for Terraform download: ${arch}" >&2
              exit 1
              ;;
          esac

          install_dir="${RUNNER_TEMP}/terraform-${version}"
          mkdir -p "${install_dir}"

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_${arch}.zip" \
            -o "${RUNNER_TEMP}/terraform.zip"
          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_SHA256SUMS" \
            -o "${RUNNER_TEMP}/terraform_SHA256SUMS"

          grep "terraform_${version}_linux_${arch}.zip" "${RUNNER_TEMP}/terraform_SHA256SUMS" | sha256sum --check --status
          unzip -q "${RUNNER_TEMP}/terraform.zip" -d "${install_dir}"

          terraform_path="${install_dir}/terraform"
          echo "TF_ACC_TERRAFORM_PATH=${terraform_path}" >> "${GITHUB_ENV}"
          "${terraform_path}" version

      - name: Validate acceptance manifest parity
        shell: bash
        run: |
          set -euo pipefail
          GOCACHE="$PWD/.cache/go-build" \
          GOMODCACHE="$PWD/.cache/gomod" \
          go test ./internal/provider -run TestAcceptanceManifestCoverage

      - name: Run full acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-acceptance-harness.sh
