name: Acceptance Full

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      dockhand_image:
        description: "Dockhand image (for example: fnsys/dockhand:latest)"
        required: false
        default: "fnsys/dockhand:latest"
      test_regex:
        description: "Go test regex for acceptance run"
        required: false
        default: "TestAcc"

permissions:
  contents: read

concurrency:
  group: acceptance-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full Recursive Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DOCKHAND_IMAGE: ${{ inputs.dockhand_image || 'fnsys/dockhand:latest' }}
      TEST_REGEX: ${{ inputs.test_regex || 'TestAcc' }}
      RUN_ENDPOINT_PROBE: "true"
      RUN_WEBUI_AUDIT: "true"
      RUN_DOCS_REFERENCE_AUDIT: "true"
      API_DRIFT_FAIL_ON_NEW: "false"
      WEBUI_AUDIT_OUT_DIR: ${{ github.workspace }}/.compat-reports
      DOCS_AUDIT_OUT_DIR: ${{ github.workspace }}/.compat-reports

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Ensure Terraform CLI
        shell: bash
        run: |
          set -euo pipefail

          if command -v terraform >/dev/null 2>&1; then
            terraform_path="$(command -v terraform)"
            echo "TF_ACC_TERRAFORM_PATH=${terraform_path}" >> "${GITHUB_ENV}"
            "${terraform_path}" version
            exit 0
          fi

          version="1.14.8"
          arch="$(uname -m)"
          case "${arch}" in
            x86_64) arch="amd64" ;;
            arm64|aarch64) arch="arm64" ;;
            *)
              echo "unsupported architecture for Terraform download: ${arch}" >&2
              exit 1
              ;;
          esac

          install_dir="${RUNNER_TEMP}/terraform-${version}"
          mkdir -p "${install_dir}"

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_${arch}.zip" \
            -o "${RUNNER_TEMP}/terraform_${version}_linux_${arch}.zip"
          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_SHA256SUMS" \
            -o "${RUNNER_TEMP}/terraform_SHA256SUMS"

          (
            cd "${RUNNER_TEMP}"
            grep "terraform_${version}_linux_${arch}.zip" terraform_SHA256SUMS | sha256sum --check --status
          )
          unzip -q "${RUNNER_TEMP}/terraform_${version}_linux_${arch}.zip" -d "${install_dir}"

          terraform_path="${install_dir}/terraform"
          echo "TF_ACC_TERRAFORM_PATH=${terraform_path}" >> "${GITHUB_ENV}"
          "${terraform_path}" version

      - name: Validate acceptance manifest parity
        shell: bash
        run: |
          set -euo pipefail
          GOCACHE="$PWD/.cache/go-build" \
          GOMODCACHE="$PWD/.cache/gomod" \
          go test ./internal/provider -run TestAcceptanceManifestCoverage

      - name: Run full acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-acceptance-harness.sh

      - name: Enforce API drift gate
        shell: bash
        env:
          API_DRIFT_OUT_DIR: ${{ github.workspace }}/.compat-reports
          WEBUI_ENDPOINTS_FILE: ${{ github.workspace }}/.compat-reports/webui-api-endpoints.txt
          DOCS_ENDPOINTS_FILE: ${{ github.workspace }}/.compat-reports/docs-reference-api-endpoints.txt
          DOCS_REPORT_FILE: ${{ github.workspace }}/.compat-reports/docs-reference-gap-audit.md
          API_DRIFT_REPORT_FILE: ${{ github.workspace }}/.compat-reports/api-drift-gate.md
          API_DRIFT_JSON_FILE: ${{ github.workspace }}/.compat-reports/api-drift-gate.json
          API_DRIFT_FAIL_ON_NEW: ${{ env.API_DRIFT_FAIL_ON_NEW }}
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/api-drift-gate.py

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-full-compat-${{ github.run_id }}
          path: |
            docs/reports/endpoint-probe.csv
            docs/reports/endpoint-probe.md
            ${{ github.workspace }}/.compat-reports/webui-api-endpoints.txt
            ${{ github.workspace }}/.compat-reports/webui-endpoint-gap-audit.md
            ${{ github.workspace }}/.compat-reports/docs-reference-api-endpoints.txt
            ${{ github.workspace }}/.compat-reports/docs-reference-gap-audit.md
            ${{ github.workspace }}/.compat-reports/api-drift-gate.md
            ${{ github.workspace }}/.compat-reports/api-drift-gate.json
          if-no-files-found: warn
