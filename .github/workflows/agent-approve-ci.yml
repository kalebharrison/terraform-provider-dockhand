name: Agent Approve CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  approve:
    name: Agent Approve CI
    if: startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-latest
    steps:
      - name: Approve pending workflow runs for agent PR
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request.head.sha;
            const headRepo = context.payload.pull_request.head.repo?.full_name;
            const thisRepo = `${owner}/${repo}`;

            if (headRepo && headRepo !== thisRepo) {
              core.info(`Skipping fork PR from ${headRepo}.`);
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              head_sha: sha,
              per_page: 100,
            });

            let approved = 0;
            for (const run of runs) {
              if (run.status !== "waiting") {
                continue;
              }
              try {
                await github.rest.actions.approveWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                approved += 1;
                core.info(`Approved workflow run ${run.id} (${run.name})`);
              } catch (error) {
                core.warning(`Could not approve run ${run.id}: ${error.message}`);
              }
            }

            if (approved === 0) {
              core.info("No workflow runs waiting for approval.");
            }
