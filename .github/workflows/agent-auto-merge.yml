name: Agent Auto Merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Agent Auto Merge
    if: >-
      ${{ github.event.pull_request.draft == false &&
          startsWith(github.event.pull_request.head.ref, 'agent/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for agent pull requests
        uses: actions/github-script@v9
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map((label) => label.name);
            if (!labels.includes("agent")) {
              core.info("Skipping auto-merge because PR is missing the agent label.");
              return;
            }
            if (!labels.includes("agent-auto-merge")) {
              core.info("Skipping auto-merge: add the agent-auto-merge label to enable squash auto-merge.");
              return;
            }

            const prBody = context.payload.pull_request.body || "";
            if (prBody.includes("<!-- Required before merge")) {
              core.info(
                "Skipping auto-merge: PR body still has unfilled 'What was fixed' / 'User impact' placeholders."
              );
              return;
            }
            if (!/## What was fixed/i.test(prBody) || !/## User impact/i.test(prBody)) {
              core.info("Skipping auto-merge: PR body missing required resolution sections.");
              return;
            }

            const headRepo = context.payload.pull_request.head?.repo?.full_name;
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (headRepo && headRepo !== thisRepo) {
              core.info(`Skipping auto-merge for fork PR from ${headRepo}.`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;

            try {
              await github.graphql(
                `mutation($pullId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullId, mergeMethod: SQUASH }) {
                    pullRequest { autoMergeRequest { enabledAt } }
                  }
                }`,
                {
                  pullId: context.payload.pull_request.node_id,
                }
              );
              core.info(`Enabled auto-merge for PR #${pullNumber}`);
            } catch (error) {
              core.warning(`Could not enable auto-merge for PR #${pullNumber}: ${error.message}`);
            }
