name: Agent Auto Merge

# Recovery-only: normal agent merges run in Agent PR Approve CI.

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: "Agent PR number to enable auto-merge for"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  enable:
    name: Agent Enable Auto Merge (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for agent pull request
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number(context.payload.inputs.pull_number);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (!pr.head?.ref?.startsWith("agent/")) {
              core.setFailed(`PR #${pullNumber} is not an agent branch PR.`);
              return;
            }
            await github.graphql(
              `mutation($pullId: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $pullId, mergeMethod: SQUASH }) {
                  pullRequest { autoMergeRequest { enabledAt } }
                }
              }`,
              { pullId: pr.node_id }
            );
            core.info(`Enabled auto-merge for PR #${pullNumber}`);
