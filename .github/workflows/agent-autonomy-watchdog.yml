name: Agent Autonomy Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  stuck-pr-checks:
    name: Unblock stuck automated PR checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Approve blocked runs and dispatch merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          /usr/bin/python3 scripts/agent_stuck_pr_watchdog.py --json | tee /tmp/stuck-prs.json
          count="$(jq '.count' /tmp/stuck-prs.json)"
          blocked="$(jq '.blocked_count // 0' /tmp/stuck-prs.json)"
          echo "Processed ${count} open trusted automated pull request(s); ${blocked} still blocked."

  undispatched-agent-intake:
    name: Dispatch queued issues to agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Re-queue undispatched eligible agent issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          /usr/bin/python3 scripts/agent_ci_intake_watchdog.py --json | tee /tmp/ci-intake.json
          count="$(jq '.count' /tmp/ci-intake.json)"
          failures="$(jq '.dispatch_failures // 0' /tmp/ci-intake.json)"
          echo "Re-dispatched intake for ${count} eligible agent issue(s); ${failures} dispatch failure(s)."

  missed-merge-cleanup:
    name: Recover missed agent merge cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dispatch merge cleanup for landed agent PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          /usr/bin/python3 scripts/agent_merge_cleanup_watchdog.py --json | tee /tmp/merge-cleanup.json
          count="$(jq '.count' /tmp/merge-cleanup.json)"
          echo "Dispatched merge cleanup for ${count} merged agent PR(s)."

  release-loop:
    name: Recover draft, lens, and tag dispatches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dispatch release drafter / orchestrate / tag when ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          /usr/bin/python3 scripts/agent_release_loop_watchdog.py --json | tee /tmp/release-loop.json
          count="$(jq '.count' /tmp/release-loop.json)"
          echo "Dispatched ${count} release-loop workflow(s)."
