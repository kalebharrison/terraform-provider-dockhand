name: Agent Merge Cleanup

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pull_number:
        description: "Merged agent PR number to run cleanup for (recovery)"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  cleanup:
    name: Close linked issues after agent merge
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues and delete agent branch
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let pr = context.payload.pull_request || null;

            if (!pr && context.eventName === "workflow_dispatch") {
              const pullNumber = Number(context.payload.inputs.pull_number);
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
              pr = data;
            }

            if (!pr && context.eventName === "push") {
              const commits = context.payload.commits || [];
              let pullNumber = null;
              for (const commit of commits) {
                const match = (commit.message || "").match(/\(#(\d+)\)\s*$/m);
                if (match) {
                  pullNumber = Number(match[1]);
                  break;
                }
              }
              if (pullNumber) {
                try {
                  const { data } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
                  if (data.merged_at) {
                    pr = data;
                  }
                } catch (error) {
                  core.info(`Could not load PR #${pullNumber} from push commit: ${error.message}`);
                }
              }
            }

            if (!pr?.merged && !pr?.merged_at) {
              core.info("No merged pull request to clean up.");
              return;
            }

            const headRef = pr.head?.ref || "";
            const keepBranches = new Set(["automation/compat-reports-sync"]);
            const isAgentBranch = headRef.startsWith("agent/");
            const isAutomationBranch = headRef.startsWith("automation/");
            const isTrustedCursorBranch =
              headRef.startsWith("cursor/") &&
              pr.user?.login === "cursor[bot]" &&
              pr.head?.repo?.full_name === `${owner}/${repo}`;

            if (
              !isAgentBranch &&
              !isAutomationBranch &&
              !isTrustedCursorBranch &&
              context.eventName !== "workflow_dispatch"
            ) {
              core.info(`Skipping non-automated PR #${pr.number} (${headRef || "unknown ref"}).`);
              return;
            }

            if (!isAgentBranch) {
              if (headRef && !keepBranches.has(headRef)) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${headRef}` });
                  core.info(`Deleted automated branch ${headRef} after merge.`);
                } catch (error) {
                  if (error.status !== 422) {
                    core.warning(`Could not delete branch ${headRef}: ${error.message}`);
                  }
                }
              }
              core.info(`Skipping issue cleanup for automation PR #${pr.number}.`);
              return;
            }

            const closeRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const issueNumbers = new Set();
            let match;
            while ((match = closeRegex.exec(pr.body || "")) !== null) {
              issueNumbers.add(Number(match[1]));
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            const section = (heading) => {
              const re = new RegExp(`## ${heading}\\s*\\n+([\\s\\S]*?)(?=\\n## |$)`, "i");
              const m = (pr.body || "").match(re);
              return m ? m[1].trim() : "";
            };

            if (issueNumbers.size === 0) {
              core.info(`PR #${pr.number} has no linked issues in body.`);
              return;
            }

            await ensureLabel(
              "awaiting-release",
              "FBCA04",
              "Issue fixed on main and waiting for a tagged release"
            );

            const whatFixed = section("What was fixed");
            const userImpact = section("User impact");
            let summary = whatFixed || (pr.title || "").replace(/^fix(\([^)]+\))?:\s*/i, "").trim();
            if (!summary) {
              summary = "_See linked pull request for details._";
            }
            const impactBlock = userImpact ? `### User impact\n\n${userImpact}\n\n` : "";

            for (const issueNumber of issueNumbers) {
              const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              if (issue.data.state !== "closed") {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: "closed",
                });
                core.info(`Closed issue #${issueNumber}.`);
              }

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: "in-progress",
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: "agent-dispatched",
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ["awaiting-release"],
              });

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const alreadyNotified = comments.some((c) =>
                (c.body || "").includes("Posted by Agent Merge Cleanup")
              );
              if (alreadyNotified) {
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  "## Fix merged to `main`",
                  "",
                  `This issue was addressed in PR #${pr.number}: ${pr.html_url}`,
                  "",
                  "### What was fixed",
                  "",
                  summary,
                  "",
                  impactBlock,
                  "### Release status",
                  "",
                  "The change is on `main` but **not yet in a tagged release**.",
                  "When a version is published, **Agent Release Tag** will comment here with the tag and upgrade instructions.",
                  "",
                  "### If the problem continues",
                  "",
                  "Comment here with **reopen** or describe what still fails after upgrading.",
                  "",
                  "---",
                  "_Posted by Agent Merge Cleanup._",
                ].join("\n"),
              });
            }

            if (headRef.startsWith("agent/")) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${headRef}` });
                core.info(`Deleted agent branch ${headRef} after merge.`);
              } catch (error) {
                if (error.status !== 422) {
                  core.warning(`Could not delete branch ${headRef}: ${error.message}`);
                }
              }
            }
