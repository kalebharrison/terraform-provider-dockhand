name: Agent Merge Cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  cleanup:
    name: Close linked issues after agent merge
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues and delete agent branch
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            const closeRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const issueNumbers = new Set();
            let match;
            while ((match = closeRegex.exec(pr.body || "")) !== null) {
              issueNumbers.add(Number(match[1]));
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            const section = (heading) => {
              const re = new RegExp(`## ${heading}\\s*\\n+([\\s\\S]*?)(?=\\n## |$)`, "i");
              const m = (pr.body || "").match(re);
              return m ? m[1].trim() : "";
            };

            if (issueNumbers.size > 0) {
              await ensureLabel(
                "awaiting-release",
                "FBCA04",
                "Issue fixed on main and waiting for a tagged release"
              );

              const whatFixed = section("What was fixed");
              const userImpact = section("User impact");
              let summary = whatFixed || (pr.title || "").replace(/^fix(\([^)]+\))?:\s*/i, "").trim();
              if (!summary) {
                summary = "_See linked pull request for details._";
              }
              const impactBlock = userImpact ? `### User impact\n\n${userImpact}\n\n` : "";

              for (const issueNumber of issueNumbers) {
                const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                if (issue.data.state !== "closed") {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    state: "closed",
                  });
                }

                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: "in-progress",
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }

                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ["awaiting-release"],
                });

                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: issueNumber,
                  per_page: 100,
                });
                const alreadyNotified = comments.some((c) =>
                  (c.body || "").includes("Posted by Agent Merge Cleanup")
                );
                if (alreadyNotified) {
                  continue;
                }

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: [
                    "## Fix merged to `main`",
                    "",
                    `This issue was addressed in PR #${pr.number}: ${pr.html_url}`,
                    "",
                    "### What was fixed",
                    "",
                    summary,
                    "",
                    impactBlock,
                    "### Release status",
                    "",
                    "The change is on `main` but **not yet in a tagged release**.",
                    "When a version is published, **Release Issue Notify** will comment here with the tag and upgrade instructions.",
                    "",
                    "### If the problem continues",
                    "",
                    "Comment here with **reopen** or describe what still fails after upgrading.",
                    "",
                    "---",
                    "_Posted by Agent Merge Cleanup._",
                  ].join("\n"),
                });
              }
            }

            const branch = pr.head?.ref || "";
            if (branch.startsWith("agent/")) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted agent branch ${branch} after merge.`);
              } catch (error) {
                if (error.status !== 422) {
                  core.warning(`Could not delete branch ${branch}: ${error.message}`);
                }
              }
            }
