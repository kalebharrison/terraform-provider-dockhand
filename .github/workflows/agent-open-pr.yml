name: Agent Open PR

on:
  workflow_run:
    workflows:
      - Agent Validate
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-pr:
    name: Agent Open PR
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'agent/') }}
    runs-on: ubuntu-latest
    outputs:
      pull_number: ${{ steps.open.outputs.pull_number }}
      auto_merge_enabled: ${{ steps.open.outputs.auto_merge_enabled }}
    steps:
      - name: Open or update agent pull request
        id: open
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const branch = run.head_branch || "";
            const headSha = run.head_sha || "";

            core.setOutput("pull_number", "");
            core.setOutput("auto_merge_enabled", "false");

            const match = branch.match(/^agent\/issue-(\d+)-(.+)$/i);
            if (!match) {
              core.setFailed(
                `Agent branch ${branch} must match agent/issue-<number>-<slug> for automated PR creation.`
              );
              return;
            }

            const issueNumber = Number(match[1]);
            const slug = match[2];
            const title = `fix(agent): issue ${issueNumber} ${slug.replace(/-/g, " ")}`;

            let issueData = null;
            let issueBody = "";
            try {
              const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              issueData = issue.data;
              issueBody = issue.data.body || "";
            } catch (error) {
              core.warning(`Could not load issue #${issueNumber}: ${error.message}`);
            }

            const labelNames = (issueData?.labels || []).map((l) =>
              typeof l === "string" ? l : l.name
            );
            const deleteAgentBranch = async () => {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted agent branch ${branch}.`);
              } catch (error) {
                if (error.status !== 422) {
                  core.warning(`Could not delete branch ${branch}: ${error.message}`);
                }
              }
            };

            const mergedPRsForBranch = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              head: `${owner}:${branch}`,
              per_page: 100,
            });
            const hasMergedPR = mergedPRsForBranch.some((pr) => Boolean(pr.merged_at));
            const issueComplete =
              issueData?.state === "closed" &&
              (labelNames.includes("awaiting-release") || labelNames.includes("released"));

            if (issueComplete || hasMergedPR) {
              core.info(
                issueComplete
                  ? `Issue #${issueNumber} is complete; skipping duplicate PR open.`
                  : `Merged PR already exists for ${branch}; skipping duplicate PR open.`
              );
              await deleteAgentBranch();
              return;
            }

            const sectionFromIssue = (body, headings) => {
              if (!body) return "";
              for (const heading of headings) {
                const re = new RegExp(
                  `##\\s*${heading.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&")}[^\\n]*\\n([\\s\\S]*?)(?=\\n## |$)`,
                  "i"
                );
                const found = body.match(re);
                if (found && found[1].trim()) {
                  return found[1].trim();
                }
              }
              return "";
            };

            const whatFixed =
              sectionFromIssue(issueBody, ["What was fixed", "Problem", "Description", "Summary"]) ||
              issueBody.split("\n").find((line) => line.trim()) ||
              title;
            const userImpact =
              sectionFromIssue(issueBody, ["User impact", "Done when", "Acceptance criteria", "Expected behavior"]) ||
              "See linked issue for operator impact and verification steps.";

            const placeholder = (value) =>
              !value ||
              value.includes("<!-- Required before merge") ||
              value.trim().length < 8;

            const automationSection = [
              "### Automation",
              "",
              `- Validate run: ${run.html_url}`,
              `- Branch: \`${branch}\``,
              `- Head: \`${headSha}\``,
              "",
              "Opened by the Agent Open PR workflow.",
            ].join("\n");

            const defaultBody = [
              "## Agent-managed change",
              "",
              "This pull request was created by the repository agent workflow (Cursor Cloud Agent + GitHub Actions).",
              "Commits on the branch should include `Co-authored-by: Cursor Agent <noreply@cursor.com>`.",
              "",
              `Fixes #${issueNumber}`,
              "",
              "## What was fixed",
              "",
              whatFixed,
              "",
              "## User impact",
              "",
              userImpact,
              "",
              "## Validation",
              "",
              "- [ ] `./scripts/verify.sh --quality`",
              `- [ ] Agent Validate: ${run.html_url}`,
              "",
              automationSection,
            ].join("\n");

            const mergeBody = (existingBody) => {
              if (!existingBody || !existingBody.includes("## What was fixed")) {
                return defaultBody;
              }
              const withoutAutomation = existingBody.replace(
                /\n### Automation[\s\S]*$/,
                ""
              );
              return `${withoutAutomation.trim()}\n\n${automationSection}`;
            };

            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              per_page: 100,
            });

            if (existing.length > 0) {
              const pr = existing[0];
              const prDetail = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              const updatedBody = mergeBody(prDetail.data.body || "");
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: pr.number,
                title,
                body: updatedBody,
              });
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: ["agent"],
              });
              if (!placeholder(whatFixed) && !placeholder(userImpact)) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: ["agent-auto-merge"],
                });
              }
              core.setOutput("pull_number", String(pr.number));
              core.setOutput(
                "auto_merge_enabled",
                !placeholder(whatFixed) && !placeholder(userImpact) ? "true" : "false"
              );
              core.info(`Updated existing PR #${pr.number}`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base: "main",
              body: defaultBody,
              maintainer_can_modify: true,
              draft: false,
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: created.data.number,
              labels: ["agent"],
            });

            if (!placeholder(whatFixed) && !placeholder(userImpact)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: created.data.number,
                labels: ["agent-auto-merge"],
              });
            }

            core.setOutput("pull_number", String(created.data.number));
            core.setOutput(
              "auto_merge_enabled",
              !placeholder(whatFixed) && !placeholder(userImpact) ? "true" : "false"
            );
            core.info(`Created PR #${created.data.number}`);

  approve-ci:
    name: Agent Approve CI
    needs: open-pr
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'agent/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Approve pending workflow runs for agent PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha || '' }}"
          if [[ -z "${sha}" ]]; then
            echo "Missing head SHA from Agent Validate workflow_run." >&2
            exit 1
          fi
          /usr/bin/python3 scripts/agent_approve_pr_ci.py --head-sha "${sha}" --json || true

  enable-auto-merge:
    name: Agent Enable Auto Merge
    needs: [open-pr, approve-ci]
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'agent/') &&
          needs.open-pr.outputs.auto_merge_enabled == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.merge.outputs.enabled }}
    steps:
      - name: Enable squash auto-merge
        id: merge
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput("enabled", "false");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number("${{ needs.open-pr.outputs.pull_number }}");
            if (!pullNumber) {
              core.setFailed("Missing pull request number from open-pr job.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            try {
              await github.graphql(
                `mutation($pullId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullId, mergeMethod: SQUASH }) {
                    pullRequest { autoMergeRequest { enabledAt } }
                  }
                }`,
                { pullId: pr.node_id }
              );
              core.info(`Enabled auto-merge for PR #${pullNumber}`);
              core.setOutput("enabled", "true");
            } catch (error) {
              core.warning(`Could not enable auto-merge for PR #${pullNumber}: ${error.message}`);
            }
