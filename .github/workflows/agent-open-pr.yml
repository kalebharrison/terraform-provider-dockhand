name: Agent Open PR

on:
  workflow_run:
    workflows:
      - Agent Validate
    types:
      - completed

permissions:
  actions: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  open-pr:
    name: Agent Open PR
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'agent/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update agent pull request
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const branch = run.head_branch || "";
            const headSha = run.head_sha || "";

            const match = branch.match(/^agent\/issue-(\d+)-(.+)$/i);
            if (!match) {
              core.setFailed(
                `Agent branch ${branch} must match agent/issue-<number>-<slug> for automated PR creation.`
              );
              return;
            }

            const issueNumber = Number(match[1]);
            const slug = match[2];
            const title = `fix(agent): issue ${issueNumber} ${slug.replace(/-/g, " ")}`;

            let issueBody = "";
            try {
              const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              issueBody = issue.data.body || "";
            } catch (error) {
              core.warning(`Could not load issue #${issueNumber}: ${error.message}`);
            }

            const sectionFromIssue = (body, headings) => {
              if (!body) return "";
              for (const heading of headings) {
                const re = new RegExp(
                  `##\\s*${heading.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&")}[^\\n]*\\n([\\s\\S]*?)(?=\\n## |$)`,
                  "i"
                );
                const found = body.match(re);
                if (found && found[1].trim()) {
                  return found[1].trim();
                }
              }
              return "";
            };

            const whatFixed =
              sectionFromIssue(issueBody, ["What was fixed", "Problem", "Description", "Summary"]) ||
              issueBody.split("\n").find((line) => line.trim()) ||
              title;
            const userImpact =
              sectionFromIssue(issueBody, ["User impact", "Done when", "Acceptance criteria", "Expected behavior"]) ||
              "See linked issue for operator impact and verification steps.";

            const placeholder = (value) =>
              !value ||
              value.includes("<!-- Required before merge") ||
              value.trim().length < 8;

            const automationSection = [
              "### Automation",
              "",
              `- Validate run: ${run.html_url}`,
              `- Branch: \`${branch}\``,
              `- Head: \`${headSha}\``,
              "",
              "Opened by the Agent Open PR workflow.",
            ].join("\n");

            const defaultBody = [
              "## Agent-managed change",
              "",
              "This pull request was created by the repository agent workflow (Cursor Cloud Agent + GitHub Actions).",
              "Commits on the branch should include `Co-authored-by: Cursor Agent <noreply@cursor.com>`.",
              "",
              `Fixes #${issueNumber}`,
              "",
              "## What was fixed",
              "",
              whatFixed,
              "",
              "## User impact",
              "",
              userImpact,
              "",
              "## Validation",
              "",
              "- [ ] `./scripts/verify.sh --quality`",
              `- [ ] Agent Validate: ${run.html_url}`,
              "",
              automationSection,
            ].join("\n");

            const mergeBody = (existingBody) => {
              if (!existingBody || !existingBody.includes("## What was fixed")) {
                return defaultBody;
              }
              const withoutAutomation = existingBody.replace(
                /\n### Automation[\s\S]*$/,
                ""
              );
              return `${withoutAutomation.trim()}\n\n${automationSection}`;
            };

            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              per_page: 100,
            });

            if (existing.length > 0) {
              const pr = existing[0];
              const prDetail = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              const updatedBody = mergeBody(prDetail.data.body || "");
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: pr.number,
                title,
                body: updatedBody,
              });
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: ["agent"],
              });
              if (!placeholder(whatFixed) && !placeholder(userImpact)) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: ["agent-auto-merge"],
                });
              }
              core.info(`Updated existing PR #${pr.number}`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base: "main",
              body: defaultBody,
              maintainer_can_modify: true,
              draft: false,
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: created.data.number,
              labels: ["agent"],
            });

            if (!placeholder(whatFixed) && !placeholder(userImpact)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: created.data.number,
                labels: ["agent-auto-merge"],
              });
            }

            core.info(`Created PR #${created.data.number}`);

  approve-ci:
    name: Agent Approve CI
    needs: open-pr
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'agent/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Approve pending workflow runs for agent PR
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run.head_sha || "";

            if (!sha) {
              core.setFailed("Missing head SHA from Agent Validate workflow_run.");
              return;
            }

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const skipRun = (run) => {
              if (run.name === "Agent Validate" || run.name === "Agent Open PR") {
                return true;
              }
              // Push-triggered runs share the same SHA as the PR head commit.
              return run.event === "push" || run.event === "workflow_run";
            };

            const listRuns = async () =>
              github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                head_sha: sha,
                per_page: 100,
              });

            let approved = 0;
            let rerun = 0;

            for (let attempt = 0; attempt < 12; attempt += 1) {
              const runs = await listRuns();
              const pending = runs.filter(
                (run) =>
                  !skipRun(run) &&
                  (run.status === "waiting" ||
                    (run.status === "completed" && run.conclusion === "action_required"))
              );

              for (const run of pending) {
                if (run.status === "waiting") {
                  try {
                    await github.rest.actions.approveWorkflowRun({
                      owner,
                      repo,
                      run_id: run.id,
                    });
                    approved += 1;
                    core.info(`Approved workflow run ${run.id} (${run.name})`);
                  } catch (error) {
                    core.warning(`Could not approve run ${run.id}: ${error.message}`);
                  }
                  continue;
                }

                if (run.conclusion === "action_required") {
                  try {
                    await github.rest.actions.reRunWorkflow({
                      owner,
                      repo,
                      run_id: run.id,
                    });
                    rerun += 1;
                    core.info(`Re-ran workflow run ${run.id} (${run.name}) after action_required`);
                  } catch (error) {
                    core.warning(`Could not rerun run ${run.id}: ${error.message}`);
                  }
                }
              }

              if (approved > 0 || rerun > 0) {
                break;
              }

              if (attempt < 11) {
                core.info(
                  `No pending PR workflow runs yet; waiting 5s (attempt ${attempt + 1}/12)`
                );
                await sleep(5000);
              }
            }

            if (approved === 0 && rerun === 0) {
              core.info("No workflow runs required approval or rerun.");
            } else {
              core.info(
                `Approved ${approved} and re-ran ${rerun} workflow run(s) for ${sha}.`
              );
            }
