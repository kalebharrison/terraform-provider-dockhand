name: Agent Release Orchestrate

on:
  workflow_run:
    workflows:
      - Dockhand Release Watch
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  dispatch-release-lens:
    name: Open release lens issue when gate is ready
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require validated Release Watch job
        if: github.event_name == 'workflow_run'
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion="$(/usr/bin/python3 scripts/workflow_run_job_conclusion.py \
            --run-id "${SOURCE_RUN_ID}" \
            --job-name "Validate Provider Against Dockhand Release" \
            --json | jq -r '.conclusion // empty')"
          if [[ "${conclusion}" != "success" ]]; then
            echo "validated=false" >> "${GITHUB_OUTPUT}"
            echo "Release Watch run ${SOURCE_RUN_ID} did not validate (job conclusion=${conclusion:-none}); skipping orchestrate."
            exit 0
          fi
          echo "validated=true" >> "${GITHUB_OUTPUT}"

      - name: Evaluate release gate for lens dispatch
        if: github.event_name == 'workflow_dispatch' || steps.validated.outputs.validated == 'true'
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! /usr/bin/python3 scripts/release_gate_check.py --mode lens --json > /tmp/release-gate.json; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            cat /tmp/release-gate.json || true
            exit 0
          fi
          jq -r '.ready_for_lens_dispatch' /tmp/release-gate.json > /tmp/ready
          jq -r '.version' /tmp/release-gate.json > /tmp/version
          jq -r '.tier' /tmp/release-gate.json > /tmp/tier
          jq -r '.awaiting_release_issues | join(", ")' /tmp/release-gate.json > /tmp/awaiting
          {
            echo "ready=$(cat /tmp/ready)"
            echo "version=$(cat /tmp/version)"
            echo "tier=$(cat /tmp/tier)"
            echo "awaiting=$(cat /tmp/awaiting)"
          } >> "${GITHUB_OUTPUT}"

      - name: Create release lens issue
        if: steps.gate.outputs.ready == 'true'
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          TIER: ${{ steps.gate.outputs.tier }}
          AWAITING: ${{ steps.gate.outputs.awaiting }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.VERSION;
            const tier = process.env.TIER || "patch";
            const awaiting = process.env.AWAITING || "";
            const title = `release: prepare v${version}`;

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${title}"`,
            });
            if (existing.data.total_count > 0) {
              core.info(`Release lens issue already open: #${existing.data.items[0].number}`);
              return;
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            await ensureLabel("release-candidate", "5319E7", "Automated provider release lens review");
            await ensureLabel("agent", "0E8A16", "Automated agent-authored work");

            const body = [
              "## Problem",
              `Provider release **v${version}** is ready for automated release-tier lens review and tagging.`,
              "",
              "CI release gates passed. Fixes are on `main` and issues are awaiting release.",
              "",
              "## Done when",
              `- Complete release-tier lens review per \`docs/testing/release-lens-review.md\` (**${tier}** tier)`,
              `- Append \`### Release v${version} — verdict\` with **Clear to tag: yes** to \`docs/reports/agent-review-log.md\` when all required lenses pass`,
              "- No unresolved **high** severity findings remain",
              "- Push the agent branch and let **Agent Release Tag** publish the GitHub release after merge",
              "",
              "## Context",
              `- Tier: ${tier}`,
              `- Awaiting-release issues: ${awaiting || "none listed"}`,
              `- Gate script: \`scripts/release_gate_check.py\``,
              `- Tagging workflow: \`.github/workflows/agent-release-tag.yml\``,
            ].join("\n");

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ["release-candidate", "agent"],
            });
            core.info(`Created release lens issue #${created.data.number}`);
