name: Agent Release Tag

on:
  push:
    branches:
      - main
    paths:
      - docs/reports/agent-review-log.md
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  prepare-release-watch:
    name: Ensure Release Watch green on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Dockhand Release Watch succeeded on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ensure_release_watch_green.py --retries 1 --json

  evaluate-release:
    name: Evaluate release gate when lens verdict clears
    needs: prepare-release-watch
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Evaluate release gate for tagging
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! /usr/bin/python3 scripts/release_gate_check.py --mode tag --json > /tmp/release-gate.json; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            cat /tmp/release-gate.json || true
            exit 0
          fi
          {
            echo "ready=true"
            echo "tag=$(jq -r '.tag' /tmp/release-gate.json)"
            echo "version=$(jq -r '.version' /tmp/release-gate.json)"
          } >> "${GITHUB_OUTPUT}"

  publish-artifacts:
    name: Build and publish release artifacts
    needs: evaluate-release
    if: needs.evaluate-release.outputs.ready == 'true'
    uses: ./.github/workflows/release-artifacts.yml
    with:
      version: ${{ needs.evaluate-release.outputs.version }}
    secrets: inherit

  housekeeping:
    name: Close lens issue, label released issues, cut CHANGELOG
    needs: [evaluate-release, publish-artifacts]
    if: needs.evaluate-release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release URL
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.evaluate-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url -q .url)"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Close release lens issue
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.evaluate-release.outputs.version }}
          TAG: ${{ needs.evaluate-release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.VERSION;
            const tag = process.env.TAG;
            const releaseUrl = process.env.RELEASE_URL || "";
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "release: prepare v${version}"`,
            });
            if (search.data.total_count === 0) {
              core.info("No open release lens issue to close.");
              return;
            }
            const issue = search.data.items[0];
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                "## Released automatically",
                "",
                `GitHub release \`${tag}\` was published by **Agent Release Tag**.`,
                releaseUrl ? `Release: ${releaseUrl}` : "",
                "",
                "Artifacts are GPG-signed for Terraform Registry; build provenance is attached via GitHub artifact attestations.",
                "",
                "---",
                "_Posted by Agent Release Tag._",
              ].filter(Boolean).join("\n"),
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: "closed",
            });

      - name: Label awaiting-release issues and cut CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.evaluate-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/release_housekeeping.py \
            --version "${VERSION}" \
            --cut-changelog \
            --commit-changelog \
            --json

      - name: Comment on released issues
        uses: actions/github-script@v9
        env:
          TAG: ${{ needs.evaluate-release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = (process.env.TAG || "").trim();
            const releaseUrl = process.env.RELEASE_URL || "";

            if (!tag) {
              core.setFailed("Missing release tag.");
              return;
            }

            let release;
            try {
              const relResp = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = relResp.data;
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`No GitHub release found for tag ${tag}.`);
                return;
              }
              throw error;
            }

            const body = release.body || "";
            const prRefRegex = /#(\d+)/g;
            const prNumbers = new Set();
            let prMatch;
            while ((prMatch = prRefRegex.exec(body)) !== null) {
              prNumbers.add(Number(prMatch[1]));
            }

            const closeRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const issueNumbers = new Set();

            for (const prNumber of prNumbers) {
              try {
                const prResp = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                const prBody = prResp.data.body || "";
                let match;
                while ((match = closeRegex.exec(prBody)) !== null) {
                  issueNumbers.add(Number(match[1]));
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (issueNumbers.size === 0) {
              core.info("No linked issues found in release PR references.");
              return;
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            await ensureLabel("released", "0E8A16", "Issue is included in a published release");
            await ensureLabel("in-progress", "1D76DB", "Issue is linked to an open pull request");
            await ensureLabel("awaiting-release", "FBCA04", "Issue fixed on main and waiting for a tagged release");

            for (const issueNumber of issueNumbers) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              if (comments.some((c) => (c.body || "").includes("Posted by Release Issue Notify"))) {
                core.info(`Issue #${issueNumber} already notified; skipping.`);
                continue;
              }

              let whatFixed = "";
              let userImpact = "";
              for (const prNumber of prNumbers) {
                try {
                  const prResp = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                  const prBody = prResp.data.body || "";
                  const section = (heading, text) => {
                    const re = new RegExp(`## ${heading}\\s*\\n+([\\s\\S]*?)(?=\\n## |$)`, "i");
                    const m = text.match(re);
                    return m ? m[1].trim() : "";
                  };
                  const wf = section("What was fixed", prBody);
                  const ui = section("User impact", prBody);
                  if (wf && !whatFixed) whatFixed = wf;
                  if (ui && !userImpact) userImpact = ui;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }

              const version = tag.replace(/^v/, "");
              const upgradeBlock = [
                "### Upgrade",
                "",
                "In your Terraform configuration:",
                "",
                "```hcl",
                "terraform {",
                "  required_providers {",
                "    dockhand = {",
                '      source  = "kalebharrison/dockhand"',
                `      version = ">= ${version}"`,
                "    }",
                "  }",
                "}",
                "```",
                "",
                "Then run `terraform init -upgrade`.",
              ].join("\n");

              const reopenBlock = [
                "### If the problem continues",
                "",
                `Please **reopen this issue** or **comment here** if you still see the problem **after upgrading to \`${tag}\`**.`,
                "",
                "Include provider version, Dockhand version, and a minimal repro or error message.",
              ].join("\n");

              const bodyParts = [
                `## Released in \`${tag}\``,
                "",
                releaseUrl ? `Release notes: ${releaseUrl}` : "",
                "",
              ];

              if (whatFixed) bodyParts.push("### What was fixed", "", whatFixed, "");
              if (userImpact) bodyParts.push("### User impact", "", userImpact, "");
              bodyParts.push(upgradeBlock, "", reopenBlock, "", "---", "_Posted by Release Issue Notify._");

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: bodyParts.filter((line) => line !== undefined).join("\n"),
              });

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ["released"],
              });

              for (const label of ["in-progress", "awaiting-release"]) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
