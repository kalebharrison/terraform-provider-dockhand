name: Agent Stall Watchdog

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  redispatch-stalled-agents:
    name: Re-dispatch stalled Cloud Agents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find stalled agent dispatches
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/agent_stall_watchdog.py --json > /tmp/agent-stall.json
          count="$(jq '.stalled | length' /tmp/agent-stall.json)"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Clear stale dispatch and re-trigger intake
        if: steps.scan.outputs.count != '0'
        uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("/tmp/agent-stall.json", "utf8"));
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (const item of payload.stalled || []) {
              const issueNumber = item.number;
              const reason = item.reason || "stalled";
              core.info(`Re-dispatching stalled issue #${issueNumber}: ${reason}`);

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: "agent-dispatched",
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  "## Agent re-dispatch scheduled",
                  "",
                  `Cloud Agent progress looks stalled (${reason}).`,
                  "",
                  "Removed `agent-dispatched` and re-added `agent` so **Issue Agent Intake** can dispatch again.",
                  "",
                  "---",
                  "_Posted by Agent Stall Watchdog._",
                ].join("\n"),
              });

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: "agent",
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ["agent"],
              });
            }
