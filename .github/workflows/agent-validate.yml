name: Agent Validate

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to validate (defaults to the dispatch ref)."
        required: false
      test_regex:
        description: "Optional go test regex override (defaults to PR CI subset)."
        required: false

permissions:
  contents: read

concurrency:
  group: agent-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Agent Validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOCKHAND_IMAGE: fnsys/dockhand:latest
      DIND_IMAGE: docker:27-dind
      HAWSER_IMAGE: ghcr.io/finsys/hawser:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Verify agent workflow integrity
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          for file in .github/workflows/agent-validate.yml .github/workflows/agent-open-pr.yml .github/workflows/agent-auto-merge.yml; do
            if git cat-file -e "origin/main:${file}" 2>/dev/null; then
              git diff --exit-code origin/main -- "${file}" || {
                echo "Agent workflow ${file} differs from main; push workflow changes via a human PR."
                exit 1
              }
            fi
          done

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform

      - name: Core verification
        run: ./scripts/verify.sh --quality

      - name: Verify acceptance manifest coverage
        run: go test ./internal/provider -run TestAcceptanceManifestCoverage

      - name: Verify agent helper scripts
        run: ./scripts/test-agent-helpers.sh

      - name: Verify agent co-author trailer on HEAD
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != 0000000000000000000000000000000000000000 ]]; then
            range="${BEFORE_SHA}..${AFTER_SHA}"
          else
            git fetch origin main
            merge_base="$(git merge-base origin/main HEAD)"
            range="${merge_base}..HEAD"
          fi
          shas="$(git log "${range}" --no-merges --format=%H)"
          if [[ -z "${shas}" ]]; then
            echo "No agent commits to verify in range ${range}."
            exit 0
          fi
          while IFS= read -r sha; do
            [[ -z "${sha}" ]] && continue
            git log -1 --format=%B "${sha}" | ./scripts/agent-commit-msg.sh --check
          done <<< "${shas}"

      - name: Resolve acceptance regex
        id: regex
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.test_regex }}" ]]; then
            regex="${{ inputs.test_regex }}"
          else
            regex="$(/usr/bin/python3 scripts/acceptance-pr-ci-regex.py)"
          fi
          echo "regex=${regex}" >> "${GITHUB_OUTPUT}"
          echo "Using acceptance regex: ${regex}"

      - name: Run acceptance harness
        id: harness
        shell: bash
        env:
          DOCKHAND_TEST_ENDPOINT: http://127.0.0.1:13001
          DOCKHAND_TEST_USERNAME: tfacc
          DOCKHAND_TEST_PASSWORD: tfaccpass123!
          DOCKHAND_TEST_AUTH_PROVIDER: local
          DOCKHAND_TEST_DIND_HOST: dind
          DOCKHAND_TEST_DIND_PORT: "2375"
          DOCKHAND_TEST_ENABLE_PRUNE_ACTIONS: "true"
          DOCKHAND_TEST_PRUNE_MODE: containers
          TF_ACC: "1"
        run: |
          set -euo pipefail
          TEST_REGEX="${{ steps.regex.outputs.regex }}" \
          RUN_ENDPOINT_PROBE=false \
          ./scripts/run-acceptance-harness.sh

      - name: Scrub acceptance failure logs
        if: failure() && steps.harness.outcome == 'failure'
        run: python3 scripts/scrub-artifact-json.py

      - name: Upload acceptance failure logs
        if: failure() && steps.harness.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: agent-validate-logs-${{ github.run_id }}
          path: |
            /tmp/dh-*.json
            /tmp/dh-*.code
          if-no-files-found: ignore
