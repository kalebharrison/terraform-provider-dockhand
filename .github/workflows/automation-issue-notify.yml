name: Automation Issue Notify

# Disabled manually. workflow_run removed so Go CI / lint completions do not
# enqueue skipped notify runs on every push.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Open or close automation failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const wr = context.payload.workflow_run;
            const workflowName = wr.name || "Unknown workflow";
            const eventName = wr.event || "unknown";
            const conclusion = (wr.conclusion || "").toLowerCase();
            const defaultBranch = context.payload.repository?.default_branch || "main";
            const branch = wr.head_branch || defaultBranch;
            const runUrl = wr.html_url || `https://github.com/${owner}/${repo}/actions/runs/${wr.id}`;
            const failureStates = new Set(["cancelled", "failure", "startup_failure", "timed_out"]);
            const agentFixable = new Set([
              "Go CI",
              "Workflow Lint",
              "Shell Lint",
              "Gitleaks",
              "Agent Validate",
            ]);
            const infraWorkflows = new Set(["Acceptance Full", "Dockhand Release Watch"]);
            const dispatchAgent = agentFixable.has(workflowName) && !infraWorkflows.has(workflowName);
            const issueTitle = dispatchAgent
              ? `CI failure: ${workflowName}`
              : `[Automation] Workflow failing: ${workflowName}`;
            const legacyTitle = `[Automation] Workflow failing: ${workflowName}`;

            if (eventName === "pull_request") return;
            if (branch !== defaultBranch) return;

            if (workflowName === "Dockhand Release Watch") {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: wr.id,
                per_page: 100,
              });
              const validated = jobs.find((job) => job.name === "Validate Provider Against Dockhand Release");
              if (!validated || validated.conclusion !== "success") {
                core.info("Skipping Release Watch notify for discover/skip-only run.");
                return;
              }
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            await ensureLabel("ci", "5319e7", "CI, release, or automation work");
            await ensureLabel("maintenance", "c5def5", "Refactors, cleanup, or repo hygiene");
            await ensureLabel("agent", "0E8A16", "Automated agent-authored work");
            await ensureLabel("no-agent", "ededed", "Automation tracker — do not dispatch Cloud Agent");

            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "all", per_page: 100 });
            const findIssue = (title) =>
              issues.filter((issue) => !issue.pull_request && issue.title === title).sort((a, b) => b.number - a.number)[0];
            const existingIssue = findIssue(issueTitle) || (dispatchAgent ? findIssue(legacyTitle) : null);

            let failedJobs = [];
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: wr.id, per_page: 100 });
              failedJobs = jobs.filter((job) => failureStates.has((job.conclusion || "").toLowerCase()));
            } catch (error) {
              core.info(`Could not list jobs for workflow run ${wr.id}: ${error.message}`);
            }

            const failedJobLines = failedJobs.length > 0
              ? failedJobs.map((job) => `- \`${job.name}\`${job.html_url ? `: ${job.html_url}` : ""}`).join("\n")
              : "- Workflow failed before any individual job reported a failure.";

            const issueBody = dispatchAgent
              ? [
                  "## Problem",
                  `Default-branch workflow **${workflowName}** is failing on \`${branch}\`.`,
                  "",
                  "Investigate the failed jobs, fix provider code/tests/docs/workflows, and restore a green \`main\` branch.",
                  "",
                  "## Done when",
                  `- **${workflowName}** succeeds on the default branch`,
                  "- Root cause is fixed in repo code or CI configuration as appropriate",
                  "- \`./scripts/verify.sh --quality\` passes when the failure is provider-related",
                  "",
                  "## Context",
                  `- Conclusion: \`${conclusion || "unknown"}\``,
                  `- Commit: \`${wr.head_sha || "unknown"}\``,
                  `- Run: ${runUrl}`,
                  "",
                  "Failed jobs:",
                  failedJobLines,
                  "",
                  "Issue Agent Intake should dispatch a Cloud Agent automatically.",
                ].join("\n")
              : [
                  "Automation is failing on the default branch.",
                  "",
                  `- Workflow: \`${workflowName}\``,
                  `- Conclusion: \`${conclusion || "unknown"}\``,
                  `- Event: \`${eventName}\``,
                  `- Branch: \`${branch}\``,
                  `- Commit: \`${wr.head_sha || "unknown"}\``,
                  `- Run: ${runUrl}`,
                  "",
                  "Failed jobs:",
                  failedJobLines,
                  "",
                  "This issue is managed automatically. It is updated on repeated failures and closed when the workflow succeeds again.",
                ].join("\n");

            const failureLabels = dispatchAgent
              ? ["ci", "maintenance", "agent"]
              : ["ci", "maintenance", "no-agent"];

            if (failureStates.has(conclusion)) {
              if (existingIssue) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existingIssue.number,
                  title: issueTitle,
                  body: issueBody,
                  state: "open",
                });
                await github.rest.issues.addLabels({ owner, repo, issue_number: existingIssue.number, labels: failureLabels });
              } else {
                await github.rest.issues.create({ owner, repo, title: issueTitle, body: issueBody, labels: failureLabels });
              }
              return;
            }

            if (conclusion === "success") {
              for (const title of new Set([issueTitle, legacyTitle])) {
                const issue = findIssue(title);
                if (issue?.state === "open") {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: `Recovered in ${runUrl}. Closing this automatically managed issue.`,
                  });
                  await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
                }
              }
            }
