name: Compat Reports Sync

on:
  workflow_run:
    workflows:
      - Acceptance Full
      - Dockhand Release Watch
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync compatibility reports to main
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download compat reports artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: compat-reports-sync
          path: incoming

      - name: Skip when artifact missing
        if: steps.download.outcome != 'success'
        run: |
          echo "No compat-reports-sync artifact for run ${{ github.event.workflow_run.id }}; skipping."
          exit 0

      - name: Checkout main
        if: steps.download.outcome == 'success'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish reports
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          COMPAT_DIR="$PWD/incoming" ./scripts/compat-reports-publish.sh

      - name: Create pull request
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v9
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        with:
          script: |
            const { execSync } = require("child_process");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.payload.workflow_run.id;
            const branch = `agent/compat-reports-${runId}`;

            const dirty = execSync("git status --porcelain", { encoding: "utf8" }).trim();
            if (!dirty) {
              core.info("Compatibility reports already up to date on main.");
              return;
            }

            execSync(`git checkout -b ${branch}`);
            execSync("git add docs/reports docs/non-present-endpoints.md");
            execSync(
              `git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: refresh compatibility reports from CI\\n\\nSource: ${process.env.SOURCE_WORKFLOW} (${process.env.SOURCE_RUN_URL})\\n\\nCo-authored-by: Cursor Agent <noreply@cursor.com>"`
            );
            execSync(`git push origin HEAD:${branch} --force`);

            const title = "chore: refresh compatibility reports from CI";
            const body = [
              "## Automated compatibility report refresh",
              "",
              "Updates committed probe and API drift baselines from a green CI compatibility run.",
              "No maintainer machine or production Dockhand credentials are required.",
              "",
              `- Source workflow: **${process.env.SOURCE_WORKFLOW}**`,
              `- Source run: ${process.env.SOURCE_RUN_URL}`,
              "",
              "Opened by Compat Reports Sync.",
            ].join("\n");

            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              per_page: 10,
            });
            if (existing.length > 0) {
              core.info(`PR already open: #${existing[0].number}`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base: "main",
              body,
              maintainer_can_modify: true,
              draft: false,
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: created.data.number,
              labels: ["agent", "agent-auto-merge", "maintenance"],
            });

            core.info(`Created PR #${created.data.number}`);
