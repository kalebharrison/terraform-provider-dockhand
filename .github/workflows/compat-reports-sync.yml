name: Compat Reports Sync

on:
  workflow_run:
    workflows:
      - Acceptance Full
      - Dockhand Release Watch
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compat-reports-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync compatibility reports to PR
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download compat reports artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: compat-reports-sync
          path: incoming

      - name: Skip when artifact missing
        if: steps.download.outcome != 'success'
        run: |
          echo "No compat-reports-sync artifact for run ${{ github.event.workflow_run.id }}; skipping."
          exit 0

      - name: Commit reports to sync branch
        id: publish
        if: steps.download.outcome == 'success'
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SYNC_BRANCH: automation/compat-reports-sync-${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          COMPAT_DIR="$PWD/incoming" ./scripts/compat-reports-publish.sh

          if [[ -z "$(git status --porcelain docs/reports docs/non-present-endpoints.md)" ]]; then
            echo "Compatibility reports already up to date on main."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git checkout -B "${SYNC_BRANCH}"
          git add docs/reports docs/non-present-endpoints.md
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$(cat <<EOF
          chore: refresh compatibility reports from CI

          Source: ${SOURCE_WORKFLOW} (${SOURCE_RUN_URL})
          Validation already passed in the source workflow; docs-only sync.
          EOF
          )"
          git push origin HEAD:"${SYNC_BRANCH}"
          echo "branch=${SYNC_BRANCH}" >> "${GITHUB_OUTPUT}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open compatibility reports PR
        if: steps.publish.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SYNC_BRANCH: ${{ steps.publish.outputs.branch }}
        with:
          script: |
            const title = "chore: refresh compatibility reports from CI";
            const body = [
              "## What was fixed",
              "",
              "- **Problem:** Compatibility report refreshes cannot push directly to protected `main`.",
              `- **Cause:** ${process.env.SOURCE_WORKFLOW} produced updated report artifacts.`,
              "- **Change:** Refresh generated compatibility report docs from the successful CI artifact.",
              "",
              "## Validation",
              "",
              `- Source workflow: ${process.env.SOURCE_WORKFLOW} (${process.env.SOURCE_RUN_URL})`,
              "- Report artifacts were generated by a successful compatibility workflow.",
            ].join("\n");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.SYNC_BRANCH;
            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              per_page: 100,
            });
            if (existing.length) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existing[0].number,
                title,
                body,
              });
              core.info(`Updated compat reports PR #${existing[0].number}`);
            } else {
              const pull = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: branch,
                base: "main",
                body,
              });
              core.info(`Opened compat reports PR #${pull.data.number}`);
            }

      - name: Close obsolete compatibility report PRs
        if: steps.publish.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          SYNC_BRANCH: ${{ steps.publish.outputs.branch }}
        with:
          script: |
            const title = "chore: refresh compatibility reports from CI";
            const branch = process.env.SYNC_BRANCH;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const pull of pulls) {
              if (pull.title !== title || pull.head.ref === branch) {
                continue;
              }
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                state: "closed",
              });
              core.info(`Closed obsolete compat reports PR #${pull.number}`);
            }
