name: Compat Reports Sync

on:
  workflow_run:
    workflows:
      - Acceptance Full
      - Dockhand Release Watch
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: compat-reports-sync
  cancel-in-progress: false

jobs:
  gate:
    name: Require validated compatibility run
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.check.outputs.should_sync }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide whether source run produced reports
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          should_sync=false
          case "${SOURCE_WORKFLOW}" in
            "Acceptance Full")
              conclusion="$(/usr/bin/python3 scripts/workflow_run_job_conclusion.py \
                --run-id "${SOURCE_RUN_ID}" \
                --job-name "Full Recursive Acceptance" \
                --json | jq -r '.conclusion // empty')"
              if [[ "${conclusion}" == "success" ]]; then
                should_sync=true
              fi
              ;;
            "Dockhand Release Watch")
              conclusion="$(/usr/bin/python3 scripts/workflow_run_job_conclusion.py \
                --run-id "${SOURCE_RUN_ID}" \
                --job-name "Validate Provider Against Dockhand Release" \
                --json | jq -r '.conclusion // empty')"
              if [[ "${conclusion}" == "success" ]]; then
                should_sync=true
              fi
              ;;
          esac
          echo "should_sync=${should_sync}" >> "${GITHUB_OUTPUT}"
          echo "Source ${SOURCE_WORKFLOW} run ${SOURCE_RUN_ID}: should_sync=${should_sync} (job conclusion=${conclusion:-none})"

  sync:
    name: Sync compatibility reports to main
    needs: gate
    if: needs.gate.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: automation/compat-reports-sync
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download compat reports artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: compat-reports-sync
          path: incoming

      - name: Skip when artifact missing
        if: steps.download.outcome != 'success'
        run: |
          echo "No compat-reports-sync artifact for run ${{ github.event.workflow_run.id }}; skipping."
          exit 0

      - name: Publish compatibility reports
        id: publish
        if: steps.download.outcome == 'success'
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          COMPAT_DIR="$PWD/incoming" ./scripts/compat-reports-publish.sh

          if [[ -z "$(git status --porcelain docs/reports docs/non-present-endpoints.md)" ]]; then
            echo "Compatibility reports already up to date on main."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Skip timestamp/source_run/Date-only churn — that loop opens a PR every
          # Release Watch cycle and floods watching maintainer email.
          if ! /usr/bin/python3 scripts/compat_reports_changed.py --check-working-tree; then
            echo "Compatibility reports have no substantive changes (volatile metadata only)."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git add docs/reports docs/non-present-endpoints.md
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$(cat <<EOF
          chore: refresh compatibility reports from CI

          Source: ${SOURCE_WORKFLOW} (${SOURCE_RUN_URL})
          Validation already passed in the source workflow; docs-only sync.
          EOF
          )"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Push directly to main
        id: direct
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git push origin HEAD:main; then
            echo "pushed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "pushed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Push fallback branch for auto-merge
        if: steps.publish.outputs.changed == 'true' && steps.direct.outputs.pushed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "${SYNC_BRANCH}"
          git push origin HEAD:"${SYNC_BRANCH}" --force

      - name: Ensure auto-merge PR exists
        if: steps.publish.outputs.changed == 'true' && steps.direct.outputs.pushed != 'true'
        id: pr
        uses: actions/github-script@v9
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SYNC_BRANCH: ${{ env.SYNC_BRANCH }}
        with:
          script: |
            const title = "chore: refresh compatibility reports from CI";
            const body = [
              "## Automated compatibility report refresh",
              "",
              "Docs-only update from a green compatibility workflow. Acceptance already ran upstream.",
              "",
              `- Source workflow: ${process.env.SOURCE_WORKFLOW}`,
              `- Source run: ${process.env.SOURCE_RUN_URL}`,
            ].join("\n");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.SYNC_BRANCH;
            const open = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              per_page: 100,
            });
            let pullNumber;
            if (open.length) {
              pullNumber = open[0].number;
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pullNumber,
                title,
                body,
              });
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: branch,
                base: "main",
                body,
              });
              pullNumber = created.data.number;
            }
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullNumber,
              labels: ["maintenance", "compat-reports-sync", "skip-changelog", "agent-auto-merge"],
            });
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("pull_number", String(pullNumber));

      - name: Approve blocked PR checks
        if: steps.publish.outputs.changed == 'true' && steps.direct.outputs.pushed != 'true'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -uo pipefail
          /usr/bin/python3 scripts/agent_approve_pr_ci.py --head-sha "${HEAD_SHA}" --json || true

      - name: Dispatch PR approve and merge
        if: steps.publish.outputs.changed == 'true' && steps.direct.outputs.pushed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PULL_NUMBER: ${{ steps.pr.outputs.pull_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run agent-pr-approve-ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f "head_sha=${HEAD_SHA}" \
            -f "pull_number=${PULL_NUMBER}"

      - name: Close obsolete compatibility report PRs
        if: steps.publish.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          SYNC_BRANCH: ${{ env.SYNC_BRANCH }}
        with:
          script: |
            const title = "chore: refresh compatibility reports from CI";
            const branch = process.env.SYNC_BRANCH;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const pull of pulls) {
              if (pull.title !== title || pull.head.ref === branch) {
                continue;
              }
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                state: "closed",
              });
              core.info(`Closed obsolete compat reports PR #${pull.number}`);
            }
