name: Compat Reports Sync

on:
  workflow_run:
    workflows:
      - Acceptance Full
      - Dockhand Release Watch
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: compat-reports-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync compatibility reports to main
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download compat reports artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: compat-reports-sync
          path: incoming

      - name: Skip when artifact missing
        if: steps.download.outcome != 'success'
        run: |
          echo "No compat-reports-sync artifact for run ${{ github.event.workflow_run.id }}; skipping."
          exit 0

      - name: Publish reports to main
        if: steps.download.outcome == 'success'
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          COMPAT_DIR="$PWD/incoming" ./scripts/compat-reports-publish.sh

          if [[ -z "$(git status --porcelain docs/reports docs/non-present-endpoints.md)" ]]; then
            echo "Compatibility reports already up to date on main."
            exit 0
          fi

          git add docs/reports docs/non-present-endpoints.md
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$(cat <<EOF
          chore: refresh compatibility reports from CI

          Source: ${SOURCE_WORKFLOW} (${SOURCE_RUN_URL})
          Validation already passed in the source workflow; docs-only sync.
          EOF
          )"
          git push origin HEAD:main

      - name: Close obsolete compatibility report PRs
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "chore: refresh compatibility reports from CI";
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const pull of pulls) {
              if (pull.title !== title) {
                continue;
              }
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                state: "closed",
              });
              core.info(`Closed obsolete compat reports PR #${pull.number}`);
            }
