name: Compat Reports Sync

on:
  workflow_run:
    workflows:
      - Acceptance Full
      - Dockhand Release Watch
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compat-reports-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync compatibility reports to main
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download compat reports artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: compat-reports-sync
          path: incoming

      - name: Skip when artifact missing
        if: steps.download.outcome != 'success'
        run: |
          echo "No compat-reports-sync artifact for run ${{ github.event.workflow_run.id }}; skipping."
          exit 0

      - name: Publish reports
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          COMPAT_DIR="$PWD/incoming" ./scripts/compat-reports-publish.sh

      - name: Update single compatibility reports PR
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v9
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SYNC_BRANCH: agent/compat-reports-sync
        with:
          script: |
            const { execSync } = require("child_process");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.SYNC_BRANCH;
            const title = "chore: refresh compatibility reports from CI";

            const dirty = execSync("git status --porcelain", { encoding: "utf8" }).trim();
            if (!dirty) {
              core.info("Compatibility reports already up to date on main.");
              return;
            }

            execSync(`git checkout -B ${branch}`);
            execSync("git add docs/reports docs/non-present-endpoints.md");
            execSync(
              `git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: refresh compatibility reports from CI\\n\\nSource: ${process.env.SOURCE_WORKFLOW} (${process.env.SOURCE_RUN_URL})"`
            );
            execSync(`git push origin HEAD:${branch} --force`);

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            for (const pull of openPulls) {
              if (pull.title !== title || pull.head.ref === branch) {
                continue;
              }
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pull.number,
                state: "closed",
              });
              core.info(`Closed superseded compat PR #${pull.number} (${pull.head.ref})`);
            }

            const existing = openPulls.filter(
              (pull) => pull.head.ref === branch && pull.title === title
            );
            if (existing.length > 0) {
              core.info(`Updated open PR #${existing[0].number} on ${branch}`);
              return;
            }

            const body = [
              "## Automated compatibility report refresh",
              "",
              "Updates probe and API drift baselines from a green CI compatibility run.",
              "One shared PR is force-updated per run (no PR spam).",
              "",
              `- Source workflow: **${process.env.SOURCE_WORKFLOW}**`,
              `- Source run: ${process.env.SOURCE_RUN_URL}`,
              "",
              "Merge when convenient; reports are docs-only.",
            ].join("\n");

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base: "main",
              body,
              maintainer_can_modify: true,
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: created.data.number,
              labels: ["maintenance"],
            });

            core.info(`Created PR #${created.data.number}`);
