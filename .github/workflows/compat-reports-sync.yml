name: Compat Reports Sync

on:
  workflow_run:
    workflows:
      - Acceptance Full
      - Dockhand Release Watch
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: compat-reports-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync compatibility reports to main
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download compat reports artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: compat-reports-sync
          path: incoming

      - name: Skip when artifact missing
        if: steps.download.outcome != 'success'
        run: |
          echo "No compat-reports-sync artifact for run ${{ github.event.workflow_run.id }}; skipping."
          exit 0

      - name: Publish reports
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          COMPAT_DIR="$PWD/incoming" ./scripts/compat-reports-publish.sh

      - name: Commit compatibility baselines to main
        if: steps.download.outcome == 'success'
        shell: bash
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports docs/non-present-endpoints.md
          if git diff --staged --quiet; then
            echo "Compatibility reports already up to date on main."
            exit 0
          fi
          git commit -m "$(cat <<EOF
          chore: refresh compatibility reports from CI

          Source: ${SOURCE_WORKFLOW} (${SOURCE_RUN_URL})
          EOF
          )"
          git push origin HEAD:main
