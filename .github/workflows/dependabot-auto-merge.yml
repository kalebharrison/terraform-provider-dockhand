name: Dependabot Auto Merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge for Dependabot PRs
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge when checks pass
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });

            const labels = (pr.labels || []).map((label) =>
              typeof label === "string" ? label : label.name
            );
            if (!labels.includes("dependencies")) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pullNumber,
                labels: ["dependencies"],
              });
            }

            try {
              await github.graphql(
                `mutation($pullId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullId, mergeMethod: SQUASH }) {
                    pullRequest { autoMergeRequest { enabledAt } }
                  }
                }`,
                { pullId: pr.node_id }
              );
              core.info(`Enabled auto-merge for Dependabot PR #${pullNumber}`);
            } catch (error) {
              core.warning(`Could not enable auto-merge for PR #${pullNumber}: ${error.message}`);
            }
