name: Dockhand Release Watch

on:
  schedule:
    - cron: "10 */6 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional Dockhand image tag to test (for example: 0.28.0)."
        required: false
      force_validate:
        description: "Run full validation even when Dockhand tag/digest is unchanged."
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  discover:
    name: Discover Dockhand Release
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pick.outputs.image }}
      tag: ${{ steps.pick.outputs.tag }}
      digest: ${{ steps.pick.outputs.digest }}
      last_tag: ${{ steps.state.outputs.last_tag }}
      last_digest: ${{ steps.state.outputs.last_digest }}
      should_run: ${{ steps.state.outputs.should_run }}
      reason: ${{ steps.state.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore watch state cache
        uses: actions/cache/restore@v5
        id: watch-state
        with:
          path: .ci-state/dockhand-release-watch
          key: dockhand-release-watch-state

      - name: Resolve image tag
        id: pick
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.image_tag }}" ]]; then
            tag="${{ inputs.image_tag }}"
          else
            tags_json="$(curl -fsSL 'https://hub.docker.com/v2/repositories/fnsys/dockhand/tags?page_size=100')"
            tag="$(echo "${tags_json}" | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -z "${tag}" ]]; then
              tag="latest"
            fi
          fi

          digest=""
          tag_json="$(curl -fsSL "https://hub.docker.com/v2/repositories/fnsys/dockhand/tags/${tag}" 2>/dev/null || true)"
          if [[ -n "${tag_json}" ]]; then
            digest="$(echo "${tag_json}" | jq -r '.images[]?.digest // empty' | head -n 1)"
          fi

          {
            echo "tag=${tag}"
            echo "digest=${digest}"
            echo "image=fnsys/dockhand:${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Migrate legacy watch state
        if: steps.watch-state.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_file=".ci-state/dockhand-release-watch/state.env"
          if [[ -f "${state_file}" ]]; then
            exit 0
          fi
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            exit 0
          fi
          state_title="release-watch: dockhand-last-tested-tag"
          state_issue="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all --search "${state_title} in:title" --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ -z "${state_issue}" ]]; then
            exit 0
          fi
          state_body="$(gh issue view "${state_issue}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body // ""')"
          last_tag="$(printf '%s\n' "${state_body}" | sed -n 's/^last_tag=//p' | head -n 1 | tr -d '\r')"
          last_digest="$(printf '%s\n' "${state_body}" | sed -n 's/^last_digest=//p' | head -n 1 | tr -d '\r')"
          updated_at="$(printf '%s\n' "${state_body}" | sed -n 's/^updated_at=//p' | head -n 1 | tr -d '\r')"
          source_run="$(printf '%s\n' "${state_body}" | sed -n 's/^source_run=//p' | head -n 1 | tr -d '\r')"
          if [[ -z "${last_tag}" ]]; then
            exit 0
          fi
          /usr/bin/python3 scripts/release_watch_state.py write \
            --tag "${last_tag}" \
            --digest "${last_digest}" \
            --updated-at "${updated_at:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" \
            --source-run "${source_run:-legacy-issue-${state_issue}}"
          echo "Migrated release-watch state from legacy issue #${state_issue}" >&2

      - name: Resolve watch state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVALIDATE_HOURS: "168"
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          decide_args=(
            --tag "${{ steps.pick.outputs.tag }}"
            --digest "${{ steps.pick.outputs.digest }}"
            --event-name "${{ github.event_name }}"
            --main-sha "${main_sha}"
            --revalidate-hours "${REVALIDATE_HOURS}"
          )
          if [[ "${{ inputs.force_validate }}" == "true" ]]; then
            decide_args+=(--force-validate)
          fi
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            decide_args+=(--manual-image-tag)
          fi
          decide_args+=(--json)
          decision="$(/usr/bin/python3 scripts/release_watch_state.py decide "${decide_args[@]}")"
          {
            echo "last_tag=$(jq -r '.last_tag' <<< "${decision}")"
            echo "last_digest=$(jq -r '.last_digest' <<< "${decision}")"
            echo "should_run=$(jq -r '.should_run' <<< "${decision}")"
            echo "reason=$(jq -r '.reason' <<< "${decision}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Seed watch state cache
        if: steps.watch-state.outputs.cache-hit != 'true' && steps.state.outputs.last_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-state/dockhand-release-watch
          if [[ ! -f .ci-state/dockhand-release-watch/state.env ]]; then
            /usr/bin/python3 scripts/release_watch_state.py write \
              --tag "${{ steps.state.outputs.last_tag }}" \
              --digest "${{ steps.state.outputs.last_digest }}"
          fi

      - name: Save seeded watch state cache
        if: steps.watch-state.outputs.cache-hit != 'true' && steps.state.outputs.last_tag != ''
        uses: actions/cache/save@v5
        with:
          path: .ci-state/dockhand-release-watch
          key: dockhand-release-watch-state

      - name: Summary
        run: |
          {
            echo "Latest detected Dockhand image: \`${{ steps.pick.outputs.image }}\`"
            echo "Latest detected digest: \`${{ steps.pick.outputs.digest || 'none' }}\`"
            echo "Last tested tag: \`${{ steps.state.outputs.last_tag || 'none' }}\`"
            echo "Last tested digest: \`${{ steps.state.outputs.last_digest || 'none' }}\`"
            echo "State cache: \`${{ steps.watch-state.outputs.cache-hit == 'true' && 'hit' || 'miss' }}\`"
            echo "Run required: \`${{ steps.state.outputs.should_run }}\` (\`${{ steps.state.outputs.reason }}\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

  validate:
    name: Validate Provider Against Dockhand Release
    if: needs.discover.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: discover
    env:
      DOCKHAND_IMAGE: ${{ needs.discover.outputs.image }}
      TEST_REGEX: "TestAcc"
      RUN_ENDPOINT_PROBE: "true"
      RUN_WEBUI_AUDIT: "true"
      RUN_DOCS_REFERENCE_AUDIT: "true"
      RUN_PRIVATE_ENDPOINT_PROBE: "true"
      API_DRIFT_FAIL_ON_NEW: "false"
      WEBUI_AUDIT_OUT_DIR: ${{ github.workspace }}/.compat-reports
      DOCS_AUDIT_OUT_DIR: ${{ github.workspace }}/.compat-reports
      PRIVATE_PROBE_OUT_DIR: ${{ github.workspace }}/.compat-reports
      PRIVATE_ENDPOINT_METHOD: "GET"
      PRIVATE_ENDPOINT_PATH: "/api/environments"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Ensure Terraform CLI
        shell: bash
        run: |
          set -euo pipefail

          if command -v terraform >/dev/null 2>&1; then
            terraform_path="$(command -v terraform)"
            echo "TF_ACC_TERRAFORM_PATH=${terraform_path}" >> "${GITHUB_ENV}"
            "${terraform_path}" version
            exit 0
          fi

          version="1.14.8"
          arch="$(uname -m)"
          case "${arch}" in
            x86_64) arch="amd64" ;;
            arm64|aarch64) arch="arm64" ;;
            *)
              echo "unsupported architecture for Terraform download: ${arch}" >&2
              exit 1
              ;;
          esac

          install_dir="${RUNNER_TEMP}/terraform-${version}"
          mkdir -p "${install_dir}"

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_${arch}.zip" \
            -o "${RUNNER_TEMP}/terraform_${version}_linux_${arch}.zip"
          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_SHA256SUMS" \
            -o "${RUNNER_TEMP}/terraform_SHA256SUMS"

          (
            cd "${RUNNER_TEMP}"
            grep "terraform_${version}_linux_${arch}.zip" terraform_SHA256SUMS | sha256sum --check --status
          )
          unzip -q "${RUNNER_TEMP}/terraform_${version}_linux_${arch}.zip" -d "${install_dir}"

          terraform_path="${install_dir}/terraform"
          echo "TF_ACC_TERRAFORM_PATH=${terraform_path}" >> "${GITHUB_ENV}"
          "${terraform_path}" version

      - name: Validate acceptance manifest parity
        shell: bash
        run: |
          set -euo pipefail
          GOCACHE="$PWD/.cache/go-build" \
          GOMODCACHE="$PWD/.cache/gomod" \
          go test ./internal/provider -run TestAcceptanceManifestCoverage

      - name: Run recursive acceptance harness
        id: harness
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-acceptance-harness.sh

      - name: Retry acceptance harness once
        if: failure() && steps.harness.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting 60s before harness retry to let DinD/Dockhand/hawser settle..."
          sleep 60
          ./scripts/run-acceptance-harness.sh

      - name: Enforce API drift gate
        shell: bash
        env:
          API_DRIFT_OUT_DIR: ${{ github.workspace }}/.compat-reports
          WEBUI_ENDPOINTS_FILE: ${{ github.workspace }}/.compat-reports/webui-api-endpoints.txt
          DOCS_ENDPOINTS_FILE: ${{ github.workspace }}/.compat-reports/docs-reference-api-endpoints.txt
          DOCS_REPORT_FILE: ${{ github.workspace }}/.compat-reports/docs-reference-gap-audit.md
          API_DRIFT_REPORT_FILE: ${{ github.workspace }}/.compat-reports/api-drift-gate.md
          API_DRIFT_JSON_FILE: ${{ github.workspace }}/.compat-reports/api-drift-gate.json
          API_DRIFT_FAIL_ON_NEW: ${{ env.API_DRIFT_FAIL_ON_NEW }}
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/api-drift-gate.py

      - name: Open issue when API drift is detected
        uses: actions/github-script@v9
        env:
          DRIFT_JSON_FILE: ${{ github.workspace }}/.compat-reports/api-drift-gate.json
          IMAGE_REF: ${{ needs.discover.outputs.image }}
          IMAGE_TAG: ${{ needs.discover.outputs.tag }}
        with:
          script: |
            const fs = require("fs");
            const path = process.env.DRIFT_JSON_FILE;
            if (!fs.existsSync(path)) {
              core.warning(`drift json file not found: ${path}`);
              return;
            }

            const drift = JSON.parse(fs.readFileSync(path, "utf8"));
            const endpoints = drift.unknown_relevant_unallowlisted || [];
            if (endpoints.length === 0) {
              core.info("No new unallowlisted relevant API drift.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `API drift detected: dockhand ${process.env.IMAGE_TAG}`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const endpointLines = endpoints.slice(0, 100).map((e) => `- \`${e}\``).join("\n");
            const body = [
              `## Problem`,
              `Detected new Dockhand API routes not currently tracked by provider probe coverage.`,
              ``,
              `## Done when`,
              `- New routes are covered in provider/probe/tests **or** explicitly allowlisted in \`docs/non-present-endpoints.md\``,
              `- API drift gate passes on a subsequent compatibility run`,
              ``,
              `## Context`,
              `- Image: \`${process.env.IMAGE_REF}\``,
              `- Run: ${runUrl}`,
              `- Count: \`${endpoints.length}\``,
              ``,
              `## Endpoints`,
              endpointLines || "- None",
            ].join("\n");

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } else {
                  throw error;
                }
              }
            };

            await ensureLabel("compatibility", "5319E7", "Dockhand compatibility validation and drift tracking");
            await ensureLabel("api-drift", "D93F0B", "New Dockhand API drift detected by scheduled audits");
            await ensureLabel("agent", "0E8A16", "Automated agent-authored work");

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${title}"`,
            });

            if (search.data.total_count > 0) {
              const issue = search.data.items[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body,
              });
              core.info(`Updated existing issue #${issue.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ["bug", "compatibility", "api-drift", "agent"],
            });
            core.info(`Created issue #${created.data.number}`);

      - name: Stage compat reports for repository sync
        if: success()
        shell: bash
        env:
          DOCKHAND_IMAGE: ${{ needs.discover.outputs.image }}
          DOCKHAND_TAG: ${{ needs.discover.outputs.tag }}
          DOCKHAND_DIGEST: ${{ needs.discover.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p .compat-sync
          cp docs/reports/endpoint-probe.md docs/reports/endpoint-probe.csv .compat-sync/
          cp "${WEBUI_AUDIT_OUT_DIR}/webui-api-endpoints.txt" .compat-sync/ 2>/dev/null || true
          cp "${DOCS_AUDIT_OUT_DIR}/docs-reference-api-endpoints.txt" .compat-sync/ 2>/dev/null || true
          jq -n \
            --arg image "${DOCKHAND_IMAGE}" \
            --arg tag "${DOCKHAND_TAG}" \
            --arg digest "${DOCKHAND_DIGEST}" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg source_run "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg workflow "Dockhand Release Watch" \
            '{
              image: $image,
              tag: $tag,
              digest: $digest,
              updated_at: $updated_at,
              source_run: $source_run,
              workflow: $workflow
            }' > .compat-sync/dockhand-last-tested.json

      - name: Upload compat reports for repository sync
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: compat-reports-sync
          path: .compat-sync/
          include-hidden-files: true
          if-no-files-found: error

      - name: Collect compatibility reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp docs/reports/endpoint-probe.csv artifacts/endpoint-probe.csv || true
          cp docs/reports/endpoint-probe.md artifacts/endpoint-probe.md || true
          cp "${WEBUI_AUDIT_OUT_DIR}/webui-api-endpoints.txt" artifacts/webui-api-endpoints.txt || true
          cp "${WEBUI_AUDIT_OUT_DIR}/webui-endpoint-gap-audit.md" artifacts/webui-endpoint-gap-audit.md || true
          cp "${DOCS_AUDIT_OUT_DIR}/docs-reference-api-endpoints.txt" artifacts/docs-reference-api-endpoints.txt || true
          cp "${DOCS_AUDIT_OUT_DIR}/docs-reference-gap-audit.md" artifacts/docs-reference-gap-audit.md || true
          cp "${PRIVATE_PROBE_OUT_DIR}/private-endpoint-probe.json" artifacts/private-endpoint-probe.json || true
          cp "${PRIVATE_PROBE_OUT_DIR}/private-endpoint-probe.md" artifacts/private-endpoint-probe.md || true
          cp "${WEBUI_AUDIT_OUT_DIR}/api-drift-gate.md" artifacts/api-drift-gate.md || true
          cp "${WEBUI_AUDIT_OUT_DIR}/api-drift-gate.json" artifacts/api-drift-gate.json || true

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dockhand-compatibility-${{ needs.discover.outputs.tag }}-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn

      - name: Success summary
        if: success()
        run: |
          echo "Dockhand compatibility validation passed for \`${{ needs.discover.outputs.image }}\`." >> "${GITHUB_STEP_SUMMARY}"

  mark_skip:
    name: Skip (No New Dockhand Tag)
    if: needs.discover.outputs.should_run != 'true'
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - name: Skip summary
        run: |
          echo "Skipping validation: image \`${{ needs.discover.outputs.image }}\` with digest \`${{ needs.discover.outputs.digest || 'none' }}\` already tested (last tag \`${{ needs.discover.outputs.last_tag || 'none' }}\`, last digest \`${{ needs.discover.outputs.last_digest || 'none' }}\`)." >> "${GITHUB_STEP_SUMMARY}"

  persist_state:
    name: Persist Last Tested Tag
    if: needs.discover.outputs.should_run == 'true' && needs.discover.outputs.reason != 'manual_override' && needs.validate.result == 'success'
    needs: [discover, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore watch state cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-state/dockhand-release-watch
          key: dockhand-release-watch-state

      - name: Write watch state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.discover.outputs.tag }}
          DIGEST: ${{ needs.discover.outputs.digest }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          /usr/bin/python3 scripts/release_watch_state.py write \
            --tag "${TAG}" \
            --digest "${DIGEST}" \
            --source-run "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --last-provider-sha "${main_sha}"

      - name: Save watch state cache
        uses: actions/cache/save@v5
        with:
          path: .ci-state/dockhand-release-watch
          key: dockhand-release-watch-state

      - name: Close legacy state issue if present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          legacy_issue="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "release-watch: dockhand-last-tested-tag in:title" --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -n "${legacy_issue}" ]]; then
            gh issue close "${legacy_issue}" --repo "${GITHUB_REPOSITORY}" --comment "Release-watch state now lives in the GitHub Actions cache (\`dockhand-release-watch-state\`). This tracking issue is retired."
          fi

      - name: Summary
        run: |
          echo "Stored release-watch state in Actions cache for tag \`${{ needs.discover.outputs.tag }}\`." >> "${GITHUB_STEP_SUMMARY}"

  report_failure:
    name: Report Compatibility Failure
    if: always() && needs.discover.outputs.should_run == 'true' && needs.validate.result == 'failure'
    needs: [discover, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for failed compatibility run
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Compatibility failure: dockhand ${process.env.IMAGE_TAG}`;
            const body = [
              `## Problem`,
              `Automated compatibility validation failed for \`${process.env.IMAGE_REF}\`.`,
              ``,
              `Investigate failing acceptance tests, endpoint probes, or provider drift against this Dockhand image.`,
              ``,
              `## Done when`,
              `- **Dockhand Release Watch** validate job passes for \`${process.env.IMAGE_REF}\``,
              `- Root cause addressed in provider code, tests, harness, or documented allowlists as appropriate`,
              `- \`./scripts/verify.sh --quality\` passes and relevant acceptance coverage is updated if behavior changed`,
              ``,
              `## Context`,
              `- Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            ].join("\n");

            const existingOpen = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${title}"`,
            });
            if (existingOpen.data.total_count > 0) {
              core.info("Open compatibility issue already exists.");
              return;
            }

            const awaitingRelease = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:title "${title}" label:awaiting-release`,
            });
            if (awaitingRelease.data.total_count > 0) {
              core.info("Compatibility failure already fixed and awaiting release; skipping duplicate issue.");
              return;
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color,
                    description,
                  });
                } else {
                  throw error;
                }
              }
            };

            await ensureLabel("compatibility", "5319E7", "Dockhand compatibility validation and drift tracking");
            await ensureLabel("agent", "0E8A16", "Automated agent-authored work");

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ["bug", "compatibility", "agent"],
            });
        env:
          IMAGE_REF: ${{ needs.discover.outputs.image }}
          IMAGE_TAG: ${{ needs.discover.outputs.tag }}
