name: Dockhand Release Watch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional Dockhand image tag to test (for example: 0.28.0)."
        required: false

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  discover:
    name: Discover Dockhand Release
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pick.outputs.image }}
      tag: ${{ steps.pick.outputs.tag }}
      digest: ${{ steps.pick.outputs.digest }}
      last_tag: ${{ steps.state.outputs.last_tag }}
      last_digest: ${{ steps.state.outputs.last_digest }}
      state_issue: ${{ steps.state.outputs.state_issue }}
      should_run: ${{ steps.state.outputs.should_run }}
      reason: ${{ steps.state.outputs.reason }}
    steps:
      - name: Resolve image tag
        id: pick
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.image_tag }}" ]]; then
            tag="${{ inputs.image_tag }}"
          else
            tags_json="$(curl -fsSL 'https://hub.docker.com/v2/repositories/fnsys/dockhand/tags?page_size=100')"
            tag="$(echo "${tags_json}" | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -z "${tag}" ]]; then
              tag="latest"
            fi
          fi

          digest=""
          tag_json="$(curl -fsSL "https://hub.docker.com/v2/repositories/fnsys/dockhand/tags/${tag}" 2>/dev/null || true)"
          if [[ -n "${tag_json}" ]]; then
            digest="$(echo "${tag_json}" | jq -r '.images[]?.digest // empty' | head -n 1)"
          fi

          {
            echo "tag=${tag}"
            echo "digest=${digest}"
            echo "image=fnsys/dockhand:${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve watch state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          state_title="release-watch: dockhand-last-tested-tag"
          tag="${{ steps.pick.outputs.tag }}"
          digest="${{ steps.pick.outputs.digest }}"
          issues_json="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all --search "${state_title} in:title" --limit 100 --json number,title,state,body)"
          state_issue="$(echo "${issues_json}" | jq -r --arg title "${state_title}" 'map(select(.title == $title)) | sort_by(.state != "OPEN") | .[0].number // empty')"
          state_body=""
          last_tag=""
          last_digest=""
          if [[ -n "${state_issue}" ]]; then
            state_body="$(gh issue view "${state_issue}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body // ""')"
            last_tag="$(printf '%s\n' "${state_body}" | sed -n 's/^last_tag=//p' | head -n 1 | tr -d '\r')"
            last_digest="$(printf '%s\n' "${state_body}" | sed -n 's/^last_digest=//p' | head -n 1 | tr -d '\r')"
          fi

          should_run="true"
          reason="new_tag_or_digest"

          if [[ -n "${{ inputs.image_tag }}" ]]; then
            should_run="true"
            reason="manual_override"
          elif [[ -z "${last_tag}" ]]; then
            should_run="true"
            reason="state_unset"
          elif [[ "${tag}" != "${last_tag}" ]]; then
            should_run="true"
            reason="new_tag"
          elif [[ -n "${digest}" && -n "${last_digest}" && "${digest}" != "${last_digest}" ]]; then
            should_run="true"
            reason="changed_digest"
          elif [[ -n "${digest}" && -z "${last_digest}" ]]; then
            should_run="true"
            reason="state_missing_digest"
          elif [[ -n "${digest}" && -n "${last_digest}" && "${digest}" == "${last_digest}" ]]; then
            should_run="false"
            reason="unchanged_tag_digest"
          else
            should_run="false"
            reason="unchanged_tag"
          fi

          {
            echo "last_tag=${last_tag}"
            echo "last_digest=${last_digest}"
            echo "state_issue=${state_issue}"
            echo "should_run=${should_run}"
            echo "reason=${reason}"
          } >> "${GITHUB_OUTPUT}"

      - name: Summary
        run: |
          {
            echo "Latest detected Dockhand image: \`${{ steps.pick.outputs.image }}\`"
            echo "Latest detected digest: \`${{ steps.pick.outputs.digest || 'none' }}\`"
            echo "Last tested tag: \`${{ steps.state.outputs.last_tag || 'none' }}\`"
            echo "Last tested digest: \`${{ steps.state.outputs.last_digest || 'none' }}\`"
            echo "State issue: \`${{ steps.state.outputs.state_issue || 'none' }}\`"
            echo "Run required: \`${{ steps.state.outputs.should_run }}\` (\`${{ steps.state.outputs.reason }}\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

  validate:
    name: Validate Provider Against Dockhand Release
    if: needs.discover.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: discover
    env:
      DOCKHAND_IMAGE: ${{ needs.discover.outputs.image }}
      TEST_REGEX: "TestAcc"
      RUN_ENDPOINT_PROBE: "true"
      RUN_WEBUI_AUDIT: "true"
      RUN_DOCS_REFERENCE_AUDIT: "true"
      RUN_PRIVATE_ENDPOINT_PROBE: "true"
      WEBUI_AUDIT_OUT_DIR: ${{ github.workspace }}/.compat-reports
      DOCS_AUDIT_OUT_DIR: ${{ github.workspace }}/.compat-reports
      PRIVATE_PROBE_OUT_DIR: ${{ github.workspace }}/.compat-reports
      PRIVATE_ENDPOINT_METHOD: "GET"
      PRIVATE_ENDPOINT_PATH: "/api/environments"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Ensure Terraform CLI
        shell: bash
        run: |
          set -euo pipefail

          if command -v terraform >/dev/null 2>&1; then
            terraform_path="$(command -v terraform)"
            echo "TF_ACC_TERRAFORM_PATH=${terraform_path}" >> "${GITHUB_ENV}"
            "${terraform_path}" version
            exit 0
          fi

          version="1.14.8"
          arch="$(uname -m)"
          case "${arch}" in
            x86_64) arch="amd64" ;;
            arm64|aarch64) arch="arm64" ;;
            *)
              echo "unsupported architecture for Terraform download: ${arch}" >&2
              exit 1
              ;;
          esac

          install_dir="${RUNNER_TEMP}/terraform-${version}"
          mkdir -p "${install_dir}"

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_${arch}.zip" \
            -o "${RUNNER_TEMP}/terraform_${version}_linux_${arch}.zip"
          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_SHA256SUMS" \
            -o "${RUNNER_TEMP}/terraform_SHA256SUMS"

          (
            cd "${RUNNER_TEMP}"
            grep "terraform_${version}_linux_${arch}.zip" terraform_SHA256SUMS | sha256sum --check --status
          )
          unzip -q "${RUNNER_TEMP}/terraform_${version}_linux_${arch}.zip" -d "${install_dir}"

          terraform_path="${install_dir}/terraform"
          echo "TF_ACC_TERRAFORM_PATH=${terraform_path}" >> "${GITHUB_ENV}"
          "${terraform_path}" version

      - name: Validate acceptance manifest parity
        shell: bash
        run: |
          set -euo pipefail
          GOCACHE="$PWD/.cache/go-build" \
          GOMODCACHE="$PWD/.cache/gomod" \
          go test ./internal/provider -run TestAcceptanceManifestCoverage

      - name: Run recursive acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-acceptance-harness.sh

      - name: Collect compatibility reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp docs/reports/endpoint-probe.csv artifacts/endpoint-probe.csv || true
          cp docs/reports/endpoint-probe.md artifacts/endpoint-probe.md || true
          cp "${WEBUI_AUDIT_OUT_DIR}/webui-api-endpoints.txt" artifacts/webui-api-endpoints.txt || true
          cp "${WEBUI_AUDIT_OUT_DIR}/webui-endpoint-gap-audit.md" artifacts/webui-endpoint-gap-audit.md || true
          cp "${DOCS_AUDIT_OUT_DIR}/docs-reference-api-endpoints.txt" artifacts/docs-reference-api-endpoints.txt || true
          cp "${DOCS_AUDIT_OUT_DIR}/docs-reference-gap-audit.md" artifacts/docs-reference-gap-audit.md || true
          cp "${PRIVATE_PROBE_OUT_DIR}/private-endpoint-probe.json" artifacts/private-endpoint-probe.json || true
          cp "${PRIVATE_PROBE_OUT_DIR}/private-endpoint-probe.md" artifacts/private-endpoint-probe.md || true

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dockhand-compatibility-${{ needs.discover.outputs.tag }}-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn

      - name: Success summary
        if: success()
        run: |
          echo "Dockhand compatibility validation passed for \`${{ needs.discover.outputs.image }}\`." >> "${GITHUB_STEP_SUMMARY}"

  mark_skip:
    name: Skip (No New Dockhand Tag)
    if: needs.discover.outputs.should_run != 'true'
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - name: Skip summary
        run: |
          echo "Skipping validation: image \`${{ needs.discover.outputs.image }}\` with digest \`${{ needs.discover.outputs.digest || 'none' }}\` already tested (last tag \`${{ needs.discover.outputs.last_tag || 'none' }}\`, last digest \`${{ needs.discover.outputs.last_digest || 'none' }}\`)." >> "${GITHUB_STEP_SUMMARY}"

  persist_state:
    name: Persist Last Tested Tag
    if: needs.discover.outputs.should_run == 'true' && needs.discover.outputs.reason != 'manual_override' && needs.validate.result == 'success'
    needs: [discover, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Update watch state issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.discover.outputs.tag }}
          DIGEST: ${{ needs.discover.outputs.digest }}
          STATE_ISSUE: ${{ needs.discover.outputs.state_issue }}
        run: |
          set -euo pipefail
          state_title="release-watch: dockhand-last-tested-tag"
          state_body="last_tag=${TAG}
          last_digest=${DIGEST}
          updated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source_run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          issue_number="${STATE_ISSUE}"
          if [[ -z "${issue_number}" ]]; then
            issue_url="$(gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${state_title}" \
              --body "${state_body}")"
            issue_number="${issue_url##*/}"
          else
            gh issue edit "${issue_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${state_title}" \
              --body "${state_body}" >/dev/null
            gh issue reopen "${issue_number}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || true
          fi

          echo "Stored release-watch state in issue #${issue_number}" >> "${GITHUB_STEP_SUMMARY}"

  report_failure:
    name: Report Compatibility Failure
    if: always() && needs.discover.outputs.should_run == 'true' && needs.validate.result == 'failure'
    needs: [discover, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for failed compatibility run
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Compatibility failure: dockhand ${process.env.IMAGE_TAG}`;
            const body = [
              `Automated compatibility validation failed for \`${process.env.IMAGE_REF}\`.`,
              ``,
              `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              ``,
              `Please triage endpoint/resource drift before next provider release.`
            ].join("\n");

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${title}"`,
            });
            if (existing.data.total_count > 0) {
              core.info("Open compatibility issue already exists.");
              return;
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color,
                    description,
                  });
                } else {
                  throw error;
                }
              }
            };

            await ensureLabel("compatibility", "5319E7", "Dockhand compatibility validation and drift tracking");

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ["bug", "compatibility"],
            });
        env:
          IMAGE_REF: ${{ needs.discover.outputs.image }}
          IMAGE_TAG: ${{ needs.discover.outputs.tag }}
