name: Go CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  STATICCHECK_VERSION: v0.6.1

jobs:
  test:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod/go.sum are out of date. Run 'go mod tidy'."
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi

      - name: Verify docs/examples coverage
        run: /usr/bin/python3 scripts/check-doc-example-coverage.py

      - name: Validate acceptance PR CI manifest
        run: /usr/bin/python3 scripts/acceptance-pr-ci-regex.py >/dev/null

      - name: Verify helper scripts
        run: ./scripts/test-agent-helpers.sh

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          only-new-issues: true

      - name: Staticcheck
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.cache/bin"
          GOBIN="${GITHUB_WORKSPACE}/.cache/bin" go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          "${GITHUB_WORKSPACE}/.cache/bin/staticcheck" ./...

      - name: Shellcheck scripts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -x -e SC1091

      - name: Go test
        run: go test ./...

      - name: Go build
        run: go build ./...

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
