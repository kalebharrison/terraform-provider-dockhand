name: Issue Agent Intake

on:
  issues:
    types:
      - opened
      - labeled
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to dispatch"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: issue-agent-intake-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Cloud Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve issue context
        id: ctx
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;

            core.setOutput("skip", "true");

            let issueNumber = null;
            let trigger = "unknown";
            let labeledName = "";
            let commentBody = "";

            if (eventName === "workflow_dispatch") {
              issueNumber = Number(context.payload.inputs.issue_number);
              trigger = "manual";
            } else if (eventName === "issues") {
              issueNumber = context.payload.issue.number;
              if (context.payload.action === "labeled") {
                labeledName = context.payload.label?.name || "";
                trigger = "labeled";
              } else {
                trigger = "opened";
              }
            } else if (eventName === "issue_comment") {
              issueNumber = context.payload.issue.number;
              const issue = context.payload.issue;
              if (issue.state !== "open") {
                core.info("Issue is not open; skipping.");
                return;
              }
              commentBody = context.payload.comment.body || "";
              trigger = "comment";
            }

            if (!issueNumber || Number.isNaN(issueNumber)) {
              core.setFailed("Could not resolve issue number.");
              return;
            }

            const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const title = issue.data.title || "";
            const body = issue.data.body || "";
            const labels = (issue.data.labels || []).map((l) =>
              typeof l === "string" ? l : l.name
            );
            const authorType = issue.data.user?.type || "";
            const authorLogin = issue.data.user?.login || "";
            const labelsLower = labels.map((l) => l.toLowerCase());
            const hasRegression = labelsLower.includes("regression");
            const hasDispatched = labelsLower.includes("agent-dispatched");

            const fs = require("fs");
            const bodyPath = `${process.env.RUNNER_TEMP}/issue-body.txt`;
            fs.writeFileSync(bodyPath, body, "utf8");

            core.setOutput("issue_number", String(issueNumber));
            core.setOutput("title", title);
            core.setOutput("body_path", bodyPath);
            core.setOutput("labels", labels.join(","));
            core.setOutput("author_type", authorType);
            core.setOutput("author_login", authorLogin);
            core.setOutput("trigger", trigger);
            core.setOutput("labeled_name", labeledName);
            core.setOutput("comment_body", commentBody);
            core.setOutput("has_dispatched", hasDispatched ? "true" : "false");
            core.setOutput("has_regression", hasRegression ? "true" : "false");

      - name: Evaluate intake eligibility
        id: eligible
        if: steps.ctx.outputs.issue_number != ''
        shell: bash
        run: |
          set -euo pipefail
          args=(
            /usr/bin/python3 scripts/issue_agent_intake_eligibility.py
            --json
            --title "${{ steps.ctx.outputs.title }}"
            --labels "${{ steps.ctx.outputs.labels }}"
            --author-type "${{ steps.ctx.outputs.author_type }}"
            --author-login "${{ steps.ctx.outputs.author_login }}"
            --trigger "${{ steps.ctx.outputs.trigger }}"
            --body-file "${{ steps.ctx.outputs.body_path }}"
            --labeled-name "${{ steps.ctx.outputs.labeled_name }}"
            --comment-body "${{ steps.ctx.outputs.comment_body }}"
          )
          if [[ "${{ steps.ctx.outputs.has_dispatched }}" == "true" ]]; then
            args+=(--has-dispatched)
          fi
          if [[ "${{ steps.ctx.outputs.has_regression }}" == "true" ]]; then
            args+=(--has-regression)
          fi
          result="$("${args[@]}")"
          eligible="$(printf '%s' "${result}" | jq -r '.eligible')"
          reason="$(printf '%s' "${result}" | jq -r '.reason // empty')"
          echo "eligible=${eligible}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

      - name: Explain skipped intake
        if: >-
          steps.eligible.outputs.eligible == 'false' &&
          (contains(steps.eligible.outputs.reason, 'too short') ||
           contains(steps.eligible.outputs.reason, 'too vague'))
        uses: actions/github-script@v9
        env:
          SKIP_REASON: ${{ steps.eligible.outputs.reason }}
        with:
          script: |
            const issueNumber = Number("${{ steps.ctx.outputs.issue_number }}");
            const reason = process.env.SKIP_REASON || "not eligible";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                "## Agent intake skipped",
                "",
                `This issue was not dispatched automatically (${reason}).`,
                "",
                "Add a clear **Problem** / **Description** and **Done when** / **Acceptance criteria** section so an agent can work with high confidence.",
                "",
                "Maintainers can force dispatch via **Actions → Issue Agent Intake → Run workflow**.",
                "",
                "---",
                "_Posted by Issue Agent Intake._",
              ].join("\n"),
            });

      - name: Prepare dispatch
        id: dispatch
        if: steps.eligible.outputs.eligible == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number("${{ steps.ctx.outputs.issue_number }}");
            const title = "${{ steps.ctx.outputs.title }}";
            const trigger = "${{ steps.ctx.outputs.trigger }}";
            const hasRegression = "${{ steps.ctx.outputs.has_regression }}" === "true";

            const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const labels = (issue.data.labels || []).map((l) =>
              (typeof l === "string" ? l : l.name).toLowerCase()
            );

            if (!labels.includes("agent")) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ["agent"],
              });
            }

            const slugify = (value) =>
              value
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 48) || "task";
            const branch = `agent/issue-${issueNumber}-${slugify(title)}`;

            const openPRs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const branchPrefix = `agent/issue-${issueNumber}-`;
            if (openPRs.some((pr) => (pr.head?.ref || "").startsWith(branchPrefix))) {
              core.info(`Open PR already exists for issue #${issueNumber}; skipping.`);
              core.setOutput("skip", "true");
              return;
            }

            let branchExists = false;
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
              branchExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (branchExists && !hasRegression && trigger !== "manual") {
              core.info(`Branch ${branch} already exists; skipping duplicate dispatch.`);
              core.setOutput("skip", "true");
              return;
            }

            if (!branchExists) {
              const main = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: main.data.commit.sha,
              });
              core.info(`Created branch ${branch}`);
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            await ensureLabel("agent-dispatched", "5319E7", "Cursor Cloud Agent dispatched for this issue");
            await ensureLabel("in-progress", "1D76DB", "Issue is linked to an open pull request");

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ["agent-dispatched", "in-progress"],
            });

            core.setOutput("skip", "false");
            core.setOutput("branch", branch);

      - name: Dispatch Cursor Cloud Agent
        if: steps.dispatch.outputs.skip == 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${CURSOR_API_KEY:-}" ]]; then
            echo "::error::CURSOR_API_KEY repository secret is not configured. Add it in repo Settings → Secrets."
            exit 1
          fi
          /usr/bin/python3 scripts/issue_agent_intake.py \
            --issue-number "${{ steps.ctx.outputs.issue_number }}" \
            --title "${{ steps.ctx.outputs.title }}" \
            --body-file "${{ steps.ctx.outputs.body_path }}" \
            --branch "${{ steps.dispatch.outputs.branch }}"

      - name: Comment on issue
        if: steps.dispatch.outputs.skip == 'false'
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ steps.dispatch.outputs.branch }}
          TRIGGER: ${{ steps.ctx.outputs.trigger }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const trigger = process.env.TRIGGER;
            const issueNumber = Number("${{ steps.ctx.outputs.issue_number }}");
            const body = [
              "## Agent dispatched",
              "",
              `A Cursor Cloud Agent run was started for branch \`${branch}\` (trigger: \`${trigger}\`).`,
              "",
              "Next steps (automated):",
              "1. Agent pushes commits → **Agent Validate**",
              "2. **Agent Open PR** opens/updates the pull request",
              "3. **Agent Approve CI** approves pending PR checks",
              "4. **Agent Auto Merge** when checks pass and PR sections are filled (`agent-auto-merge` label)",
              "",
              "---",
              "_Posted by Issue Agent Intake._",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
