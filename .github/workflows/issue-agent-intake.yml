name: Issue Agent Intake

on:
  issues:
    types:
      - opened
      - labeled
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to dispatch"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: issue-agent-intake-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Cloud Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve issue context
        id: ctx
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;

            core.setOutput("skip", "true");

            let issueNumber = null;
            let trigger = "unknown";

            if (eventName === "workflow_dispatch") {
              issueNumber = Number(context.payload.inputs.issue_number);
              trigger = "manual";
            } else if (eventName === "issues") {
              issueNumber = context.payload.issue.number;
              if (context.payload.action === "labeled") {
                const label = (context.payload.label?.name || "").toLowerCase();
                if (label !== "agent") {
                  core.info("Ignoring non-agent label event.");
                  return;
                }
                trigger = "labeled";
              } else {
                const labels = (context.payload.issue.labels || []).map((l) => l.name.toLowerCase());
                if (!labels.includes("agent")) {
                  core.info("Issue opened without agent label; skipping.");
                  return;
                }
                trigger = "opened";
              }
            } else if (eventName === "issue_comment") {
              issueNumber = context.payload.issue.number;
              const issue = context.payload.issue;
              if (issue.state !== "open") {
                core.info("Issue is not open; skipping.");
                return;
              }
              const userType = context.payload.comment.user?.type || "";
              const login = (context.payload.comment.user?.login || "").toLowerCase();
              if (userType === "Bot" || login.includes("[bot]")) {
                core.info("Ignoring bot comment.");
                return;
              }
              const text = (context.payload.comment.body || "").trim();
              if (!/(^|\s)\/agent(\s|$)/i.test(text)) {
                core.info("Comment did not include /agent; skipping.");
                return;
              }
              trigger = "comment";
              const commentLabels = (issue.labels || []).map((l) =>
                (typeof l === "string" ? l : l.name).toLowerCase()
              );
              if (!commentLabels.includes("agent")) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ["agent"],
                });
              }
            }

            if (!issueNumber || Number.isNaN(issueNumber)) {
              core.setFailed("Could not resolve issue number.");
              return;
            }

            const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const title = issue.data.title || "";
            const body = issue.data.body || "";
            const labels = (issue.data.labels || []).map((l) => (typeof l === "string" ? l : l.name).toLowerCase());
            const hasAgent = labels.includes("agent");
            const hasRegression = labels.includes("regression");
            const hasDispatched = labels.includes("agent-dispatched");

            if (!hasAgent && trigger !== "comment") {
              core.info("Issue missing agent label; skipping.");
              return;
            }

            if (hasDispatched && !hasRegression && trigger !== "manual") {
              core.info("Issue already has agent-dispatched label; skipping duplicate dispatch.");
              return;
            }

            const hasAcceptanceSection = (text) =>
              /##\s*(done when|acceptance criteria|expected behavior|problem|what was fixed|scope)/i.test(text || "");
            const bodyTrimmed = (body || "").trim();
            if (
              trigger !== "manual" &&
              bodyTrimmed.length < 80 &&
              !hasAcceptanceSection(bodyTrimmed)
            ) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  "## Agent intake skipped",
                  "",
                  "This issue needs a clearer scope before a Cloud Agent can run with high confidence.",
                  "",
                  "Add at least one of:",
                  "- A **Problem** / **Description** paragraph",
                  "- A **Done when** or **Acceptance criteria** section",
                  "",
                  "Then comment `/agent` or re-add the `agent` label. Maintainers can force dispatch via **Actions → Issue Agent Intake → Run workflow**.",
                  "",
                  "---",
                  "_Posted by Issue Agent Intake._",
                ].join("\n"),
              });
              core.info("Issue body too vague for automated dispatch; commented and skipped.");
              return;
            }

            const slugify = (value) =>
              value
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 48) || "task";
            const branch = `agent/issue-${issueNumber}-${slugify(title)}`;

            const openPRs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const branchPrefix = `agent/issue-${issueNumber}-`;
            if (openPRs.some((pr) => (pr.head?.ref || "").startsWith(branchPrefix))) {
              core.info(`Open PR already exists for issue #${issueNumber}; skipping.`);
              return;
            }

            let branchExists = false;
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
              branchExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (branchExists && !hasRegression && trigger !== "manual") {
              core.info(`Branch ${branch} already exists; skipping duplicate dispatch.`);
              return;
            }

            if (!branchExists) {
              const main = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: main.data.commit.sha,
              });
              core.info(`Created branch ${branch}`);
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            await ensureLabel("agent-dispatched", "5319E7", "Cursor Cloud Agent dispatched for this issue");
            await ensureLabel("in-progress", "1D76DB", "Issue is linked to an open pull request");

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ["agent-dispatched", "in-progress"],
            });

            const fs = require("fs");
            const bodyPath = `${process.env.RUNNER_TEMP}/issue-body.txt`;
            fs.writeFileSync(bodyPath, body, "utf8");

            core.setOutput("skip", "false");
            core.setOutput("issue_number", String(issueNumber));
            core.setOutput("title", title);
            core.setOutput("body_path", bodyPath);
            core.setOutput("branch", branch);
            core.setOutput("trigger", trigger);

      - name: Dispatch Cursor Cloud Agent
        if: steps.ctx.outputs.skip == 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${CURSOR_API_KEY:-}" ]]; then
            echo "::error::CURSOR_API_KEY repository secret is not configured. Add it in repo Settings → Secrets."
            exit 1
          fi
          /usr/bin/python3 scripts/issue_agent_intake.py \
            --issue-number "${{ steps.ctx.outputs.issue_number }}" \
            --title "${{ steps.ctx.outputs.title }}" \
            --body-file "${{ steps.ctx.outputs.body_path }}" \
            --branch "${{ steps.ctx.outputs.branch }}"

      - name: Comment on issue
        if: steps.ctx.outputs.skip == 'false'
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ steps.ctx.outputs.branch }}
          TRIGGER: ${{ steps.ctx.outputs.trigger }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const trigger = process.env.TRIGGER;
            const issueNumber = Number("${{ steps.ctx.outputs.issue_number }}");
            const body = [
              "## Agent dispatched",
              "",
              `A Cursor Cloud Agent run was started for branch \`${branch}\` (trigger: \`${trigger}\`).`,
              "",
              "Next steps (automated):",
              "1. Agent pushes commits → **Agent Validate**",
              "2. **Agent Open PR** opens/updates the pull request",
              "3. **Agent Approve CI** approves pending PR checks",
              "4. **Agent Auto Merge** when checks pass and PR sections are filled (`agent-auto-merge` label)",
              "",
              "Reply with `/agent` to re-dispatch (remove `agent-dispatched` first if needed).",
              "",
              "---",
              "_Posted by Issue Agent Intake._",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
