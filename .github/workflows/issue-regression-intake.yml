name: Issue Regression Intake

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  intake:
    name: Reopen closed issues on regression feedback
    if: >-
      github.event.issue.state == 'closed' &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate comment and reopen when appropriate
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const issueNumber = issue.number;
            const text = (comment.body || "").trim();

            const botLogin = (comment.user?.login || "").toLowerCase();
            if (
              botLogin.includes("[bot]") ||
              botLogin === "github-actions" ||
              text.includes("Posted by Issue Resolution Notify") ||
              text.includes("Posted by Release Issue Notify")
            ) {
              core.info("Skipping bot or automation comment.");
              return;
            }

            const thanksOnly =
              /^(thanks|thank you|thx|ty|\+1|resolved|works for me|fixed for me)[!.?\s]*$/i.test(
                text
              );
            if (thanksOnly) {
              core.info("Skipping short acknowledgment comment.");
              return;
            }

            const reopenKeywords =
              /\b(still broken|not fixed|reopen|regression|persists|doesn'?t work|does not work|same issue|issue continues|not resolved|didn'?t fix|did not fix|still seeing|still happens|no longer works)\b/i;
            const explicitReopen = /\breopen\b/i.test(text);
            const substantive = text.length >= 40;

            if (!explicitReopen && !reopenKeywords.test(text) && !substantive) {
              core.info("Comment does not indicate regression; not reopening.");
              return;
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } else {
                  throw error;
                }
              }
            };

            await ensureLabel("regression", "b60205", "Reporter indicates fix did not work");
            await ensureLabel("agent", "0E8A16", "Automated agent-authored work");

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              state: "open",
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ["regression", "agent"],
            });

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issueNumber,
                name: "released",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const body = [
              "## Issue reopened",
              "",
              "Thanks for the follow-up. This issue was reopened because the reported problem may still be present.",
              "",
              "An agent will investigate. If you have not already, please include:",
              "- Provider version from your Terraform lock file",
              "- Dockhand version",
              "- Steps to reproduce or the error you still see",
              "",
              "Work will be tracked on branch `agent/issue-" + issueNumber + "-<slug>`.",
              "",
              "---",
              "_Posted by Issue Regression Intake._",
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });

            core.info(`Reopened issue #${issueNumber} for regression intake.`);
