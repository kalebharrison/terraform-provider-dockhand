name: Maintenance

on:
  schedule:
    - cron: "5 6 * * *"
    - cron: "30 7 * * 0"
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually delete branches/issues/runs (default dry-run only)"
        required: false
        type: boolean
        default: false
      delete_closed_issues:
        description: "Also delete closed automation/smoke tracker issues"
        required: false
        type: boolean
        default: false
      workflow_runs:
        description: "Prune old workflow runs (14d retain, keep 1 per workflow)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  stale:
    name: Mark and close stale issues/PRs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '5 6 * * *')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Process stale issues and pull requests
        uses: actions/stale@v11
        with:
          stale-issue-message: >
            This issue has been automatically marked stale due to inactivity.
            If it is still relevant, add a comment or update.
          close-issue-message: >
            Closing this issue due to extended inactivity.
            Reopen with new context if the problem still exists.
          stale-pr-message: >
            This pull request has been automatically marked stale due to inactivity.
            Please update to keep it active.
          close-pr-message: >
            Closing this pull request due to extended inactivity.
            Reopen or create a new PR when ready.
          days-before-issue-stale: 30
          days-before-issue-close: 14
          days-before-pr-stale: 21
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "security,pinned,in-progress,awaiting-release,released,status: needs-info"
          exempt-pr-labels: security,pinned,agent,in-progress
          operations-per-run: 200

  needs-info:
    name: Auto-close needs-info after 30 days
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '5 6 * * *')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Close inactive needs-info issues
        uses: actions/stale@v11
        with:
          any-of-labels: "status: needs-info"
          stale-issue-message: >
            No update for 30 days while this issue was labeled `status: needs-info`
            (waiting on reporter retest/feedback). Marking stale and closing.
          close-issue-message: >
            Closing after 30 days with no retest/feedback on `status: needs-info`.
            Reopen and comment if the problem still exists.
          days-before-issue-stale: 30
          days-before-issue-close: 0
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          exempt-issue-labels: security,pinned
          operations-per-run: 100

  hygiene:
    name: Prune stale agent/automation branches and trackers
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '30 7 * * 0')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run repo hygiene
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--branches --json)
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.apply }}" == "true" ]]; then
            args+=(--apply)
          fi
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.workflow_runs }}" == "true" ]]; then
            args+=(--workflow-runs --retain-days 14 --keep-minimum-runs 1)
          fi
          if [[ "${{ inputs.delete_closed_issues }}" == "true" ]]; then
            args+=(--delete-closed-issues)
          fi
          /usr/bin/python3 scripts/repo_hygiene.py "${args[@]}"

  secret-smoke:
    name: Verify release secrets and Actions settings
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check required repository secrets
        id: check
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            missing+=("GPG_PRIVATE_KEY")
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf '%s\n' "${missing[@]}" > /tmp/missing-secrets.txt
            echo "missing=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "missing=false" >> "${GITHUB_OUTPUT}"

      - name: Verify GitHub Actions automation settings
        id: settings
        if: steps.check.outputs.missing == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          /usr/bin/python3 scripts/check_automation_settings.py --json > /tmp/automation-settings.json
          set -euo pipefail
          ok="$(jq -r '.ok // false' /tmp/automation-settings.json)"
          echo "ok=${ok}" >> "${GITHUB_OUTPUT}"
          if [[ "${ok}" != "true" ]]; then
            jq -r '.blockers[]?' /tmp/automation-settings.json >&2 || true
          fi

      - name: Open or close secret health issue
        if: always() && steps.check.conclusion != 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Automation] Secret configuration required";
            const missing = "${{ steps.check.outputs.missing }}" === "true";
            const missingSecrets = fs.existsSync("/tmp/missing-secrets.txt")
              ? fs.readFileSync("/tmp/missing-secrets.txt", "utf8").trim().split("\n").filter(Boolean)
              : [];
            const problems = missingSecrets.map((name) => `- \`${name}\` is missing`);

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };
            await ensureLabel("maintenance", "c5def5", "Refactors, cleanup, or repo hygiene");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues
              .filter((issue) => !issue.pull_request && issue.title === title)
              .sort((a, b) => b.number - a.number)[0];

            if (missing) {
              const body = [
                "## Problem",
                "Release signing secret is missing.",
                "",
                "## Done when",
                "- Repository secret `GPG_PRIVATE_KEY` is configured",
                "- **Maintenance** secret-smoke job succeeds",
                "",
                "## Problems",
                ...problems,
              ].join("\n");

              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  title,
                  body,
                  state: "open",
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: ["maintenance"],
                });
              }
              core.setFailed(`Secret configuration failed: ${problems.join("; ")}`);
              return;
            }

            if (existing?.state === "open") {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: "Secret smoke check passed. Closing this automatically managed issue.",
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
              });
            }

      - name: Open or close automation settings health issue
        if: always() && steps.check.outputs.missing == 'false' && steps.settings.conclusion != 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Automation] GitHub Actions settings misconfigured";
            const settingsOk = "${{ steps.settings.outputs.ok }}" === "true";
            const payload = fs.existsSync("/tmp/automation-settings.json")
              ? JSON.parse(fs.readFileSync("/tmp/automation-settings.json", "utf8"))
              : { blockers: ["settings check did not run"] };
            const blockers = payload.blockers || [];

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };
            await ensureLabel("maintenance", "c5def5", "Refactors, cleanup, or repo hygiene");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues
              .filter((issue) => !issue.pull_request && issue.title === title)
              .sort((a, b) => b.number - a.number)[0];

            if (!settingsOk) {
              const body = [
                "## Problem",
                "GitHub Actions settings required for release automation are misconfigured.",
                "",
                "## Done when",
                "- Settings → Actions → General → Workflow permissions: **Read and write**",
                "- **Allow GitHub Actions to create and approve pull requests** is enabled",
                "- **Maintenance** secret-smoke job succeeds",
                "",
                "## Blockers",
                ...blockers.map((item) => `- ${item}`),
              ].join("\n");

              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  title,
                  body,
                  state: "open",
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: ["maintenance"],
                });
              }
              core.setFailed(`Automation settings check failed (${blockers.join("; ")})`);
              return;
            }

            if (existing?.state === "open") {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: "Automation settings check passed. Closing this automatically managed issue.",
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
