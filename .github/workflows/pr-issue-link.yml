name: PR Issue Link

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  validate:
    name: Require linked issue and mark in-progress
    runs-on: ubuntu-latest
    steps:
      - name: Validate closing reference and label linked issues
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const headRef = pr?.head?.ref || "";

            if (
              headRef.startsWith("agent/") ||
              headRef.startsWith("automation/") ||
              headRef.startsWith("cursor/repository-hygiene-automation-")
            ) {
              core.info("Skipping issue-link enforcement for agent/automation branch.");
              return;
            }

            if (pr?.user?.type === "Bot") {
              core.info("Skipping issue-link enforcement for bot PR.");
              return;
            }

            const body = pr.body || "";
            const closeRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const linked = new Set();
            let match;
            while ((match = closeRegex.exec(body)) !== null) {
              linked.add(Number(match[1]));
            }

            if (linked.size === 0 && action !== "closed") {
              core.setFailed(
                "PR description must include a closing reference (example: `Fixes #123`)."
              );
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color,
                    description,
                  });
                } else {
                  throw error;
                }
              }
            };

            if (action === "closed") {
              if (linked.size === 0) {
                return;
              }

              await ensureLabel("awaiting-release", "FBCA04", "Issue fixed on main and waiting for a tagged release");

              for (const issueNumber of linked) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: "in-progress",
                  });
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }
                }

                if (pr.merged) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    labels: ["awaiting-release"],
                  });
                }
              }
              return;
            }

            // Ensure "in-progress" label exists once.
            await ensureLabel("in-progress", "1D76DB", "Issue is linked to an open pull request");

            for (const issueNumber of linked) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ["in-progress"],
              });
            }
