name: PR Title Convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title format
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const actor = context.payload.sender?.login || "";
            const author = pr?.user?.login || "";
            const authorType = pr?.user?.type || "";
            const headRef = pr?.head?.ref || "";
            const title = (pr?.title || "").trim();

            if (headRef.startsWith("agent/")) {
              core.info("Skipping title convention check for agent branch.");
              return;
            }

            // Skip title convention checks for bot-authored PRs (Dependabot and other automation).
            if (
              authorType === "Bot" ||
              actor === "dependabot[bot]" ||
              actor === "app/dependabot" ||
              author === "dependabot[bot]" ||
              author === "app/dependabot"
            ) {
              core.info("Skipping title convention check for bot-authored PR.");
              return;
            }

            // Conventional commit-style title:
            // type(scope)!: summary
            // type: summary
            const regex = /^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([a-z0-9._\/-]+\))?(!)?:\s.+$/i;
            if (!regex.test(title)) {
              core.setFailed(
                "PR title must follow Conventional Commits style, e.g. `fix(environment): preserve agent token for agent-standard`."
              );
            }
