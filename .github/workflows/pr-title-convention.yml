name: PR Title Convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title format
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const actor = context.payload.sender?.login || "";
            const title = (pr?.title || "").trim();

            // Allow Dependabot-generated update titles.
            if (actor === "dependabot[bot]" || actor === "app/dependabot") {
              core.info("Skipping title convention check for Dependabot.");
              return;
            }

            // Conventional commit-style title:
            // type(scope)!: summary
            // type: summary
            const regex = /^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([a-z0-9._\/-]+\))?(!)?:\s.+$/i;
            if (!regex.test(title)) {
              core.setFailed(
                "PR title must follow Conventional Commits style, e.g. `fix(environment): preserve agent token for agent-standard`."
              );
            }
