name: Quality CI

on:
  pull_request:

permissions:
  contents: read

env:
  STATICCHECK_VERSION: v0.6.1

jobs:
  quality:
    name: Vet, Lint, Staticcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          only-new-issues: true

      - name: Staticcheck
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.cache/bin"
          GOBIN="${GITHUB_WORKSPACE}/.cache/bin" go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          "${GITHUB_WORKSPACE}/.cache/bin/staticcheck" ./...
