name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0). If empty, derived from ref tag."
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  SYFT_VERSION: v1.42.2

jobs:
  release:
    name: Build Zips And Publish Release
    runs-on: ubuntu-latest
    env:
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      HAS_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            v="${{ inputs.version }}"
            v="${v#v}"
          else
            # refs/tags/vX.Y.Z -> X.Y.Z
            ref="${GITHUB_REF#refs/tags/}"
            v="${ref#v}"
          fi
          if [[ -z "$v" ]]; then
            echo "version is empty" >&2
            exit 2
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: |
          ./scripts/build-packages.sh --version "${{ steps.ver.outputs.version }}" --out-dir dist-local

      - name: Install syft
        shell: bash
        run: |
          set -euo pipefail
          version="${SYFT_VERSION#v}"
          archive="syft_${version}_linux_amd64.tar.gz"
          url="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${archive}"
          mkdir -p "${RUNNER_TEMP}/syft-bin"
          curl -fsSL "${url}" -o "${RUNNER_TEMP}/${archive}"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/syft-bin" syft
          echo "${RUNNER_TEMP}/syft-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/syft-bin/syft" version

      - name: Generate SBOM (SPDX JSON)
        shell: bash
        run: |
          set -euo pipefail
          syft dir:. -o "spdx-json=dist-local/terraform-provider-dockhand_${{ steps.ver.outputs.version }}_SBOM.spdx.json"

      - name: Verify signing secrets are present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.GPG_PRIVATE_KEY }}" ]]; then
            echo "Missing secret: GPG_PRIVATE_KEY" >&2
            exit 2
          fi

      - name: Import GPG key (passphrase)
        if: ${{ env.HAS_GPG_PASSPHRASE == 'true' }}
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ env.GPG_PASSPHRASE }}

      - name: Import GPG key (no passphrase)
        if: ${{ env.HAS_GPG_PASSPHRASE != 'true' }}
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign checksums
        shell: bash
        run: |
          set -euo pipefail
          sums="dist-local/terraform-provider-dockhand_${{ steps.ver.outputs.version }}_SHA256SUMS"
          sig="${sums}.sig"
          # Terraform Registry expects a binary detached signature (not ASCII-armored).
          if [[ -n "${GPG_PASSPHRASE}" ]]; then
            gpg --batch --yes --detach-sign --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE}" \
              --output "${sig}" "${sums}"
          else
            gpg --batch --yes --detach-sign \
              --output "${sig}" "${sums}"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist-local/terraform-provider-dockhand_${{ steps.ver.outputs.version }}_*.zip
            dist-local/terraform-provider-dockhand_${{ steps.ver.outputs.version }}_manifest.json
            dist-local/terraform-provider-dockhand_${{ steps.ver.outputs.version }}_SHA256SUMS
            dist-local/terraform-provider-dockhand_${{ steps.ver.outputs.version }}_SHA256SUMS.sig
            dist-local/terraform-provider-dockhand_${{ steps.ver.outputs.version }}_SBOM.spdx.json

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          version="${{ steps.ver.outputs.version }}"
          mapfile -t zip_files < <(compgen -G "dist-local/terraform-provider-dockhand_${version}_*.zip" || true)
          files=(
            "${zip_files[@]}"
            "dist-local/terraform-provider-dockhand_${version}_manifest.json"
            "dist-local/terraform-provider-dockhand_${version}_SHA256SUMS"
            "dist-local/terraform-provider-dockhand_${version}_SHA256SUMS.sig"
            "dist-local/terraform-provider-dockhand_${version}_SBOM.spdx.json"
          )

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${files[@]}" --clobber
          else
            gh release create "${tag}" "${files[@]}" \
              --title "${tag}" \
              --generate-notes
          fi

          # gh release create can leave the release in draft state depending on
          # repository defaults, so publish it explicitly.
          gh release edit "${tag}" --draft=false --latest
