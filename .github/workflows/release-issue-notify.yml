name: Release Issue Notify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to process (for example: v0.1.48). Ignored when backfill is true."
        required: false
        type: string
      backfill:
        description: "Notify all awaiting-release issues using the latest published release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  notify:
    name: Comment released issues (recovery)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Comment linked or backfill issues
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BACKFILL: ${{ inputs.backfill }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BACKFILL}" == "true" ]]; then
            /usr/bin/python3 scripts/release_issue_notify.py --backfill --json
          else
            if [[ -z "${TAG}" ]]; then
              echo "Provide tag or set backfill=true." >&2
              exit 1
            fi
            /usr/bin/python3 scripts/release_issue_notify.py --tag "${TAG}" --json
          fi
