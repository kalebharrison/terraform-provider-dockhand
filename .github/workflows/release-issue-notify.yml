name: Release Issue Notify

on:
  workflow_run:
    workflows: ["Release Artifacts"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to process (for example: v0.1.48)"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  notify:
    name: Comment released issues
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Comment linked issues with release version
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let tag = "";
            let releaseUrl = "";
            let body = "";

            if (context.eventName === "workflow_dispatch") {
              tag = (core.getInput("tag") || "").trim();
            } else if (context.eventName === "workflow_run") {
              const wr = context.payload.workflow_run;
              tag = (wr?.head_branch || "").trim();
            }

            if (!tag) {
              core.setFailed("Could not determine release tag.");
              return;
            }

            if (!tag.startsWith("v")) {
              core.info(`Skipping non-tag workflow head branch: ${tag}`);
              return;
            }

            let release;
            try {
              const relResp = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              release = relResp.data;
            } catch (error) {
              if (error.status === 404) {
                core.info(`No GitHub release found for tag ${tag}; skipping.`);
                return;
              }
              throw error;
            }

            body = release.body || "";
            releaseUrl = release.html_url || "";

            // GitHub generated notes include PR references like #123.
            const prRefRegex = /#(\d+)/g;
            const prNumbers = new Set();
            let prMatch;
            while ((prMatch = prRefRegex.exec(body)) !== null) {
              prNumbers.add(Number(prMatch[1]));
            }

            const closeRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const issueNumbers = new Set();

            for (const prNumber of prNumbers) {
              try {
                const prResp = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                const prBody = prResp.data.body || "";
                let match;
                while ((match = closeRegex.exec(prBody)) !== null) {
                  issueNumbers.add(Number(match[1]));
                }
              } catch (error) {
                // Ignore non-PR references.
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            if (issueNumbers.size === 0) {
              core.info("No linked issues found in release PR references.");
              return;
            }

            // Ensure labels exist.
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color,
                    description,
                  });
                } else {
                  throw error;
                }
              }
            };

            await ensureLabel("released", "0E8A16", "Issue is included in a published release");
            await ensureLabel("in-progress", "1D76DB", "Issue is linked to an open pull request");
            await ensureLabel("awaiting-release", "FBCA04", "Issue fixed on main and waiting for a tagged release");

            for (const issueNumber of issueNumbers) {
              let whatFixed = "";
              let userImpact = "";
              for (const prNumber of prNumbers) {
                try {
                  const prResp = await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: prNumber,
                  });
                  const prBody = prResp.data.body || "";
                  const section = (heading, body) => {
                    const re = new RegExp(
                      `## ${heading}\\s*\\n+([\\s\\S]*?)(?=\\n## |$)`,
                      "i"
                    );
                    const m = body.match(re);
                    return m ? m[1].trim() : "";
                  };
                  const wf = section("What was fixed", prBody);
                  const ui = section("User impact", prBody);
                  if (wf && !whatFixed) whatFixed = wf;
                  if (ui && !userImpact) userImpact = ui;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }

              const version = tag.replace(/^v/, "");
              const upgradeBlock = [
                "### Upgrade",
                "",
                "In your Terraform configuration:",
                "",
                "```hcl",
                "terraform {",
                "  required_providers {",
                "    dockhand = {",
                '      source  = "kalebharrison/dockhand"',
                `      version = ">= ${version}"`,
                "    }",
                "  }",
                "}",
                "```",
                "",
                "Then run `terraform init -upgrade`.",
              ].join("\n");

              const reopenBlock = [
                "### If the problem continues",
                "",
                "Please **reopen this issue** or **comment here** if you still see the problem **after upgrading to `" + tag + "`**.",
                "",
                "Include provider version, Dockhand version, and a minimal repro or error message.",
                "Comments on closed issues are monitored; we will reopen for investigation when the fix did not work.",
              ].join("\n");

              const bodyParts = [
                `## Released in \`${tag}\``,
                "",
                releaseUrl ? `Release notes: ${releaseUrl}` : "",
                "",
              ];

              if (whatFixed) {
                bodyParts.push("### What was fixed", "", whatFixed, "");
              }
              if (userImpact) {
                bodyParts.push("### User impact", "", userImpact, "");
              }

              bodyParts.push(upgradeBlock, "", reopenBlock, "", "---", "_Posted by Release Issue Notify._");

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: bodyParts.filter((line) => line !== undefined).join("\n"),
              });

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ["released"],
              });

              // Best-effort cleanup; ignore if label isn't currently present.
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: "in-progress",
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: "awaiting-release",
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
