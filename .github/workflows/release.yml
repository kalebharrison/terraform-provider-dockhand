name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["Go CI", "Security"]
    types: [completed]

permissions:
  contents: write
  issues: write
  actions: write
  pull-requests: write

jobs:
  update_release_draft:
    name: Update release draft
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-decision:
    name: Decide whether to publish
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - name: Checkout the candidate commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Publish after CI and Security, or on manual dispatch
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.workflow_run.event }}" != "push" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="${{ github.event.workflow_run.head_sha }}"
          msg="$(git log -1 --format=%s "$sha")"
          case "$msg" in
            "chore(release):"*|"chore: refresh compatibility reports"*)
              echo "skip: $msg"
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          for wf in "Go CI" "Security"; do
            conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$sha" --workflow "$wf" --json conclusion,event \
              --jq '[.[] | select(.event=="push")][0].conclusion // ""')"
            if [ "$conclusion" != "success" ]; then
              echo "waiting: $wf is ${conclusion:-missing}"
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "go=true" >> "$GITHUB_OUTPUT"

  prepare-compat:
    name: Ensure Dockhand Compat green on main
    needs: release-decision
    if: needs.release-decision.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Dockhand Compat succeeded on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ensure_release_watch_green.py --retries 1 --json

  evaluate-release:
    name: Evaluate release gate
    needs: [release-decision, prepare-compat]
    if: needs.release-decision.outputs.go == 'true' && needs.prepare-compat.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Evaluate release gate for tagging
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! /usr/bin/python3 scripts/release_gate_check.py --mode tag --json > /tmp/release-gate.json; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            cat /tmp/release-gate.json || true
            exit 0
          fi
          {
            echo "ready=true"
            echo "tag=$(jq -r '.tag' /tmp/release-gate.json)"
            echo "version=$(jq -r '.version' /tmp/release-gate.json)"
          } >> "${GITHUB_OUTPUT}"

  publish-artifacts:
    name: Build and publish release artifacts
    needs: [release-decision, evaluate-release]
    if: needs.release-decision.outputs.go == 'true' && needs.evaluate-release.outputs.ready == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      version: ${{ needs.evaluate-release.outputs.version }}
    secrets: inherit

  housekeeping:
    name: Label released issues and cut CHANGELOG
    needs: [release-decision, evaluate-release, publish-artifacts]
    if: needs.release-decision.outputs.go == 'true' && needs.evaluate-release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release URL
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.evaluate-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url -q .url)"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Label awaiting-release issues and cut CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.evaluate-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/release_housekeeping.py \
            --version "${VERSION}" \
            --cut-changelog \
            --commit-changelog \
            --json

      - name: Comment on released issues
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.evaluate-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/release_issue_notify.py --tag "${TAG}" --json
