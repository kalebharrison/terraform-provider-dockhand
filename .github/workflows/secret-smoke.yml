name: Secret Smoke

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  verify:
    name: Verify automation secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check required repository secrets
        id: check
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "${CURSOR_API_KEY:-}" ]]; then
            missing+=("CURSOR_API_KEY")
          fi
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            missing+=("GPG_PRIVATE_KEY")
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf '%s\n' "${missing[@]}" > /tmp/missing-secrets.txt
            echo "missing=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "missing=false" >> "${GITHUB_OUTPUT}"

      - name: Verify GitHub Actions automation settings
        id: settings
        if: steps.check.outputs.missing == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          /usr/bin/python3 scripts/check_automation_settings.py --json > /tmp/automation-settings.json
          set -euo pipefail
          ok="$(jq -r '.ok // false' /tmp/automation-settings.json)"
          echo "ok=${ok}" >> "${GITHUB_OUTPUT}"
          if [[ "${ok}" != "true" ]]; then
            jq -r '.blockers[]?' /tmp/automation-settings.json >&2 || true
          fi

      - name: Verify Cursor Cloud Agents API key
        id: cursor_auth
        if: steps.check.outputs.missing == 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        shell: bash
        run: |
          set +e
          /usr/bin/python3 scripts/cursor_cloud_agents_auth.py --json \
            > /tmp/cursor-cloud-agents-auth.json \
            2> /tmp/cursor-cloud-agents-auth.err
          status=$?
          set -euo pipefail
          if [[ "${status}" -eq 0 ]]; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "ok=false" >> "${GITHUB_OUTPUT}"
          if [[ -s /tmp/cursor-cloud-agents-auth.err ]]; then
            sed 's/^/Cloud Agents API key check failed: /' /tmp/cursor-cloud-agents-auth.err >&2
          fi

      - name: Disable Cursor Bugbot for this repository (best-effort)
        id: bugbot
        if: steps.check.outputs.missing == 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        shell: bash
        run: |
          # Bugbot admin API is Team/Enterprise-only. Solo / Pro+ user keys used for
          # Cloud Agents intake commonly get "Invalid Team API Key" — that must not
          # fail Secret Smoke or keep the secret health issue open.
          set +e
          /usr/bin/python3 scripts/cursor_bugbot_settings.py --disable --best-effort --json \
            > /tmp/bugbot-settings.json \
            2> /tmp/bugbot-settings.err
          status=$?
          set -euo pipefail
          echo "ok=true" >> "${GITHUB_OUTPUT}"
          if [[ -s /tmp/bugbot-settings.err ]]; then
            sed 's/^/Bugbot settings (best-effort): /' /tmp/bugbot-settings.err >&2
          fi
          if [[ "${status}" -ne 0 ]]; then
            echo "Bugbot helper exited ${status}; ignoring (best-effort)" >&2
          fi

      - name: Open or close secret health issue
        if: always() && steps.check.conclusion != 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Automation] Secret configuration required";
            const missing = "${{ steps.check.outputs.missing }}" === "true";
            const authChecked = "${{ steps.cursor_auth.conclusion }}" !== "skipped";
            const authOk = !authChecked || "${{ steps.cursor_auth.outputs.ok }}" === "true";
            const missingSecrets = fs.existsSync("/tmp/missing-secrets.txt")
              ? fs.readFileSync("/tmp/missing-secrets.txt", "utf8").trim().split("\n").filter(Boolean)
              : [];
            const authError = fs.existsSync("/tmp/cursor-cloud-agents-auth.err")
              ? fs.readFileSync("/tmp/cursor-cloud-agents-auth.err", "utf8").trim()
              : "";
            const problems = [
              ...missingSecrets.map((name) => `- \`${name}\` is missing`),
            ];
            if (!authOk) {
              const detail = authError ? `: ${authError}` : "";
              problems.push(`- \`CURSOR_API_KEY\` failed Cursor Cloud Agents API verification (GET /v1/me)${detail}`);
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };
            await ensureLabel("no-agent", "ededed", "Automation tracker — do not dispatch Cloud Agent");
            await ensureLabel("maintenance", "c5def5", "Refactors, cleanup, or repo hygiene");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues
              .filter((issue) => !issue.pull_request && issue.title === title)
              .sort((a, b) => b.number - a.number)[0];

            if (missing || !authOk) {
              const body = [
                "## Problem",
                "Automation secrets required for hands-off agent intake and signed releases are missing or invalid.",
                "",
                "## Done when",
                "- Repository secrets are configured in GitHub Settings → Secrets and variables → Actions",
                "- `CURSOR_API_KEY` authenticates to the Cloud Agents API (`GET https://api.cursor.com/v1/me`)",
                "- **Secret Smoke** workflow succeeds on the next scheduled run",
                "",
                "## Problems",
                ...problems,
                "",
                "Bugbot admin API access is optional (Team/Enterprise). Secret Smoke does not fail when Bugbot disable is unavailable for a user API key.",
                "",
                "This issue is managed automatically and closes when secrets verify successfully.",
              ].join("\n");

              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  title,
                  body,
                  state: "open",
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: ["no-agent", "maintenance"],
                });
              }
              core.setFailed(`Secret configuration failed: ${problems.join("; ")}`);
              return;
            }

            if (existing?.state === "open") {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: "Secret smoke check passed. Closing this automatically managed issue.",
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
              });
            }

      - name: Open or close automation settings health issue
        if: always() && steps.check.outputs.missing == 'false' && steps.settings.conclusion != 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Automation] GitHub Actions settings misconfigured";
            const settingsOk = "${{ steps.settings.outputs.ok }}" === "true";
            const payload = fs.existsSync("/tmp/automation-settings.json")
              ? JSON.parse(fs.readFileSync("/tmp/automation-settings.json", "utf8"))
              : { blockers: ["settings check did not run"] };
            const blockers = payload.blockers || [];

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };
            await ensureLabel("no-agent", "ededed", "Automation tracker — do not dispatch Cloud Agent");
            await ensureLabel("maintenance", "c5def5", "Refactors, cleanup, or repo hygiene");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues
              .filter((issue) => !issue.pull_request && issue.title === title)
              .sort((a, b) => b.number - a.number)[0];

            if (!settingsOk) {
              const body = [
                "## Problem",
                "GitHub Actions settings required for hands-off agent automation are misconfigured.",
                "",
                "## Done when",
                "- Settings → Actions → General → Workflow permissions: **Read and write**",
                "- **Allow GitHub Actions to create and approve pull requests** is enabled",
                "- **Secret Smoke** workflow succeeds on the next scheduled run",
                "",
                "## Blockers",
                ...blockers.map((item) => `- ${item}`),
                "",
                "This issue is managed automatically and closes when settings verify successfully.",
              ].join("\n");

              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  title,
                  body,
                  state: "open",
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: ["no-agent", "maintenance"],
                });
              }
              core.setFailed(`Automation settings check failed (${blockers.join("; ")})`);
              return;
            }

            if (existing?.state === "open") {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: "Automation settings check passed. Closing this automatically managed issue.",
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
