name: Secret Smoke

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  verify:
    name: Verify automation secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check required repository secrets
        id: check
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "${CURSOR_API_KEY:-}" ]]; then
            missing+=("CURSOR_API_KEY")
          fi
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            missing+=("GPG_PRIVATE_KEY")
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf '%s\n' "${missing[@]}" > /tmp/missing-secrets.txt
            echo "missing=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "missing=false" >> "${GITHUB_OUTPUT}"

      - name: Verify GitHub Actions automation settings
        if: steps.check.outputs.missing == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/check_automation_settings.py --json

      - name: Disable Cursor Bugbot for this repository
        if: steps.check.outputs.missing == 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/cursor_bugbot_settings.py --disable --json

      - name: Open or close secret health issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Automation] Secret configuration required";
            const missing = "${{ steps.check.outputs.missing }}" === "true";
            const missingSecrets = fs.existsSync("/tmp/missing-secrets.txt")
              ? fs.readFileSync("/tmp/missing-secrets.txt", "utf8").trim().split("\n").filter(Boolean)
              : [];

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };
            await ensureLabel("no-agent", "ededed", "Automation tracker — do not dispatch Cloud Agent");
            await ensureLabel("maintenance", "c5def5", "Refactors, cleanup, or repo hygiene");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues
              .filter((issue) => !issue.pull_request && issue.title === title)
              .sort((a, b) => b.number - a.number)[0];

            if (missing) {
              const body = [
                "## Problem",
                "Automation secrets required for hands-off agent intake and signed releases are missing.",
                "",
                "## Done when",
                "- Repository secrets are configured in GitHub Settings → Secrets and variables → Actions",
                "- **Secret Smoke** workflow succeeds on the next scheduled run",
                "",
                "## Missing",
                ...missingSecrets.map((name) => `- \`${name}\``),
                "",
                "This issue is managed automatically and closes when secrets verify successfully.",
              ].join("\n");

              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  title,
                  body,
                  state: "open",
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: ["no-agent", "maintenance"],
                });
              }
              core.setFailed(`Missing secrets: ${missingSecrets.join(", ")}`);
              return;
            }

            if (existing?.state === "open") {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: "Secret smoke check passed. Closing this automatically managed issue.",
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
