name: Security Issue Notify

on:
  workflow_run:
    workflows:
      - CodeQL
      - Govulncheck
      - Gitleaks
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Open or close security failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const wr = context.payload.workflow_run;
            const workflowName = wr.name || "Unknown workflow";
            const eventName = wr.event || "unknown";
            const conclusion = (wr.conclusion || "").toLowerCase();
            const defaultBranch = context.payload.repository?.default_branch || "main";
            const branch = wr.head_branch || defaultBranch;
            const runUrl = wr.html_url || `https://github.com/${owner}/${repo}/actions/runs/${wr.id}`;
            const issueMarker = `<!-- security-issue-notify:${workflowName} -->`;
            const failureStates = new Set([
              "action_required",
              "cancelled",
              "failure",
              "startup_failure",
              "timed_out",
            ]);
            const dispatchAgent = true;
            const issueTitle = `Security CI failure: ${workflowName}`;
            const legacyTitle = `[Security] Workflow failing: ${workflowName}`;

            if (eventName === "pull_request") {
              core.info("Skipping pull_request-triggered workflow run.");
              return;
            }

            if (branch !== defaultBranch) {
              core.info(`Skipping workflow run on non-default branch ${branch}.`);
              return;
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description,
                });
              }
            };

            await ensureLabel("ci", "5319e7", "CI, release, or automation work");
            await ensureLabel("security", "b60205", "Security hardening or vulnerability work");
            await ensureLabel("agent", "0E8A16", "Automated agent-authored work");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const findIssue = (title) =>
              issues.filter((issue) => !issue.pull_request && issue.title === title).sort((left, right) => right.number - left.number)[0];
            const existingIssue = findIssue(issueTitle) || findIssue(legacyTitle);

            let failedJobs = [];
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: wr.id,
                per_page: 100,
              });
              failedJobs = jobs.filter((job) => failureStates.has((job.conclusion || "").toLowerCase()));
            } catch (error) {
              core.info(`Could not list jobs for workflow run ${wr.id}: ${error.message}`);
            }

            const failedJobLines = failedJobs.length > 0
              ? failedJobs.map((job) => `- \`${job.name}\`${job.html_url ? `: ${job.html_url}` : ""}`).join("\n")
              : "- Workflow failed before any individual job reported a failure.";

            const issueBody = [
              issueMarker,
              "## Problem",
              `Security workflow **${workflowName}** is failing on the default branch.`,
              "",
              "Investigate the failed jobs and restore a green security gate on `main`.",
              "",
              "## Done when",
              `- **${workflowName}** succeeds on the default branch`,
              "- Findings are remediated or documented with an accepted allowlist where appropriate",
              "",
              "## Context",
              `- Conclusion: \`${conclusion || "unknown"}\``,
              `- Commit: \`${wr.head_sha || "unknown"}\``,
              `- Run: ${runUrl}`,
              "",
              "Failed jobs:",
              failedJobLines,
              "",
              dispatchAgent ? "Issue Agent Intake should dispatch a Cloud Agent automatically." : "",
            ].filter(Boolean).join("\n");

            if (failureStates.has(conclusion)) {
              if (existingIssue) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existingIssue.number,
                  title: issueTitle,
                  body: issueBody,
                  state: "open",
                });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: existingIssue.number,
                  labels: ["security", "ci", "agent"],
                });
                core.info(`Updated issue #${existingIssue.number}.`);
              } else {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: issueTitle,
                  body: issueBody,
                  labels: ["security", "ci", "agent"],
                });
                core.info(`Opened issue #${created.data.number}.`);
              }
              return;
            }

            if (conclusion === "success") {
              for (const title of new Set([issueTitle, legacyTitle])) {
                const issue = findIssue(title);
                if (issue?.state === "open") {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: `Recovered in ${runUrl}. Closing this automatically managed issue.`,
                  });
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    state: "closed",
                  });
                  core.info(`Closed issue #${issue.number}.`);
                }
              }
              return;
            }

            core.info(`No issue action needed for conclusion ${conclusion || "unknown"}.`);
